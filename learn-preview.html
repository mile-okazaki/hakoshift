<script>
(function() {
  const DEMO_PREFIX = 'hakomana-demo';
  const CURRENT_KEY = DEMO_PREFIX + ':currentUser';

  const DEMO_USERS = [
    { uid: 'u_okada',  email: 'okada@hakomana.demo',  displayName: '岡田 誠',   role: 'instructor', label: '岡田 誠（講師）' },
    { uid: 'u_sato',   email: 'sato@hakomana.demo',   displayName: '佐藤 花子', role: 'student',    label: '佐藤 花子（受講生）' },
    { uid: 'u_suzuki', email: 'suzuki@hakomana.demo', displayName: '鈴木 一郎', role: 'student',    label: '鈴木 一郎（受講生）' },
    { uid: 'u_tanaka', email: 'tanaka@hakomana.demo', displayName: '田中 美咲', role: 'student',    label: '田中 美咲（受講生・未学習）' },
  ];
  const currentUid = localStorage.getItem(CURRENT_KEY) || 'u_okada';
  const DEMO_USER = DEMO_USERS.find(u => u.uid === currentUid) || DEMO_USERS[0];

  window.__DEMO__ = true;
  window.__DEMO_USERS__ = DEMO_USERS.map(u => ({ uid: u.uid, label: u.label }));
  window.__DEMO_CURRENT_UID__ = DEMO_USER.uid;
  window.__DEMO_SWITCH__ = function(uid) {
    localStorage.setItem(CURRENT_KEY, uid);
    location.reload();
  };

  // ----- storage helpers -----
  function _key(coll, id) { return `${DEMO_PREFIX}:${coll}:${id}`; }
  function _get(coll, id) {
    try { const raw = localStorage.getItem(_key(coll, id)); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function _set(coll, id, data) {
    localStorage.setItem(_key(coll, id), JSON.stringify(data));
    _notify(coll, id, data);
  }
  function _listDocs(coll) {
    const prefix = `${DEMO_PREFIX}:${coll}:`;
    const docs = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) {
        const id = k.substring(prefix.length);
        try {
          const data = JSON.parse(localStorage.getItem(k));
          docs.push({ id, data: () => data, exists: true });
        } catch (e) {}
      }
    }
    return docs;
  }

  // ----- snapshot listener registry -----
  const _docSubs = {};
  const _collSubs = {};
  function _notify(coll, id, data) {
    const dk = `${coll}:${id}`;
    (_docSubs[dk] || []).forEach(cb => { try { cb({ exists: data != null, data: () => data, id }); } catch (e) {} });
    (_collSubs[coll] || []).forEach(cb => {
      try { const docs = _listDocs(coll); cb({ forEach: fn => docs.forEach(fn) }); } catch (e) {}
    });
  }

  // ----- mock auth -----
  const auth = {
    currentUser: Object.assign({}, DEMO_USER, {
      updateProfile: function(p) { return Promise.resolve(); },
    }),
    onAuthStateChanged(cb) {
      Promise.resolve().then(() => cb(auth.currentUser));
      return () => {};
    },
    signOut() {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(DEMO_PREFIX)) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      location.reload();
      return Promise.resolve();
    },
    signInWithEmailAndPassword: () => Promise.resolve({ user: auth.currentUser }),
    createUserWithEmailAndPassword: () => Promise.resolve({ user: auth.currentUser }),
    signInWithPopup: () => Promise.resolve({ user: auth.currentUser }),
  };

  // ----- mock firestore -----
  const db = {
    collection(name) {
      return {
        doc(id) {
          return {
            get() {
              const data = _get(name, id);
              return Promise.resolve({ exists: data != null, data: () => data, id });
            },
            set(data, opts) {
              if (opts && opts.merge) {
                const existing = _get(name, id) || {};
                _set(name, id, Object.assign({}, existing, data));
              } else {
                _set(name, id, data);
              }
              return Promise.resolve();
            },
            update(data) {
              const existing = _get(name, id);
              if (existing == null) return Promise.reject(new Error('not-found: cannot update missing document'));
              _set(name, id, Object.assign({}, existing, data));
              return Promise.resolve();
            },
            delete() {
              localStorage.removeItem(_key(name, id));
              _notify(name, id, null);
              return Promise.resolve();
            },
            onSnapshot(cb, errCb) {
              const dk = `${name}:${id}`;
              (_docSubs[dk] = _docSubs[dk] || []).push(cb);
              Promise.resolve().then(() => {
                const data = _get(name, id);
                try { cb({ exists: data != null, data: () => data, id }); } catch (e) {}
              });
              return () => { _docSubs[dk] = (_docSubs[dk] || []).filter(l => l !== cb); };
            },
          };
        },
        add(data) {
          const id = `auto_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
          _set(name, id, data);
          return Promise.resolve({ id });
        },
        limit(n) {
          return {
            get() {
              const docs = _listDocs(name).slice(0, n);
              return Promise.resolve({
                empty: docs.length === 0,
                forEach: fn => docs.forEach(fn),
                docs,
              });
            },
          };
        },
        onSnapshot(cb, errCb) {
          (_collSubs[name] = _collSubs[name] || []).push(cb);
          Promise.resolve().then(() => {
            try { const docs = _listDocs(name); cb({ forEach: fn => docs.forEach(fn) }); } catch (e) {}
          });
          return () => { _collSubs[name] = (_collSubs[name] || []).filter(l => l !== cb); };
        },
      };
    },
  };

  // ----- mock firebase global -----
  const _authFn = function() { return auth; };
  _authFn.GoogleAuthProvider = function() { return { providerId: 'google.com' }; };
  const _fsFn = function() { return db; };
  _fsFn.FieldValue = { serverTimestamp: () => Date.now() };
  window.firebase = {
    initializeApp: () => ({ name: '[DEFAULT]' }),
    auth: _authFn,
    firestore: _fsFn,

      emoji: '📦', color: '#4f46e5', published: true, inviteCode: 'HAKO01',
      certificateEnabled: true, deadline: null,
      chapters: [
        { id: 'ch1', title: 'はじめに', order: 1 },

function tsToDate(ts) {
  if (ts == null) return null;
  if (typeof ts === 'number') return new Date(ts);
  if (ts instanceof Date) return ts;
  if (typeof ts.toDate === 'function') return ts.toDate();
  if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
  const d = new Date(ts);

}
function fmtDate(ts) {
  const d = tsToDate(ts);
  if (!d) return '—';

  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
}
function fmtDateTime(ts) {
  const d = tsToDate(ts);

  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;

function fmtRelative(ts) {
  const d = tsToDate(ts);

function deadlineInfo(course) {
  if (!course || !course.deadline) return null;
  const dl = new Date(course.deadline + 'T00:00:00');
  if (isNaN(dl.getTime())) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.round((dl.getTime() - today.getTime()) / 86400000);
  return { date: dl, days, overdue: days < 0 };
}

// 動画URL → 埋め込みURL変換（YouTube / Vimeo対応）
function toEmbedUrl(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') {
      const id = u.pathname.slice(1).split('/')[0];
      if (id) return `https://www.youtube.com/embed/${id}`;
    }
    if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch' && u.searchParams.get('v')) return `https://www.youtube.com/embed/${u.searchParams.get('v')}`;
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/]+)/);
      if (m) return `https://www.youtube.com/embed/${m[2]}`;
    }
    if (host === 'vimeo.com') {
      const m = u.pathname.match(/^\/(\d+)/);
      if (m) return `https://player.vimeo.com/video/${m[1]}`;
    }
    if (host === 'player.vimeo.com' || (host === 'youtube.com' && u.pathname.startsWith('/embed/'))) return url;
  } catch (e) { /* invalid URL */ }
  return null;
}

// 簡易リッチテキストレンダラー（# 見出し / - 箇条書き / **強調** / URL自動リンク）
function renderInline(text, keyPrefix) {
  const parts = [];
  const regex = /(\*\*[^*]+\*\*|https?:\/\/[^\s　<>"]+)/g;
  let last = 0, m, i = 0;
  while ((m = regex.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    const tok = m[0];
    if (tok.startsWith('**')) {
      parts.push(<strong key={`${keyPrefix}-b${i}`} className="font-bold text-slate-900">{tok.slice(2, -2)}</strong>);
    } else {
      parts.push(<a key={`${keyPrefix}-a${i}`} href={tok} target="_blank" rel="noopener noreferrer" className="text-indigo-600 underline break-all hover:text-indigo-800">{tok}</a>);
    }
    last = m.index + tok.length;
    i++;
  }
  if (last < text.length) parts.push(text.slice(last));
  return parts;
}
function RichText({ text }) {
  if (!text) return null;
  const lines = String(text).split('\n');
  const out = [];
  let listBuf = [];
  const flushList = (key) => {
    if (listBuf.length) {
      out.push(<ul key={`ul-${key}`} className="list-disc pl-6 space-y-1 my-2">{listBuf}</ul>);
      listBuf = [];
    }
  };
  lines.forEach((line, idx) => {
    if (line.startsWith('## ')) {
      flushList(idx);
      out.push(<h4 key={idx} className="text-base font-bold text-slate-900 mt-4 mb-1">{renderInline(line.slice(3), idx)}</h4>);
    } else if (line.startsWith('# ')) {
      flushList(idx);
      out.push(<h3 key={idx} className="text-lg font-bold text-slate-900 mt-5 mb-2 pb-1 border-b border-slate-200">{renderInline(line.slice(2), idx)}</h3>);
    } else if (line.startsWith('- ') || line.startsWith('・')) {
      listBuf.push(<li key={idx} className="text-slate-700 leading-relaxed">{renderInline(line.replace(/^(- |・)/, ''), idx)}</li>);
    } else if (line.trim() === '') {
      flushList(idx);
      out.push(<div key={idx} className="h-2" />);
    } else {
      flushList(idx);
      out.push(<p key={idx} className="text-slate-700 leading-relaxed">{renderInline(line, idx)}</p>);
    }
  });
  flushList('end');
  return <div className="text-[15px]">{out}</div>;
}

// CSVダウンロード
function downloadCSV(filename, rows) {
  const esc = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '\uFEFF' + rows.map((r) => r.map(esc).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
  const path = SVG[name] || SVG.Circle;
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} dangerouslySetInnerHTML={{ __html: path }}
    />
  );
}

// ========== 共通UI ==========
function Spinner({ size = 20, className = '' }) {
  return <Icon name="Loader2" size={size} className={`animate-spin ${className}`} />;
}

function ProgressBar({ percent, size = 'md', color }) {
  const h = size === 'sm' ? 'h-1.5' : size === 'lg' ? 'h-3' : 'h-2';
  const pct = Math.max(0, Math.min(100, Math.round(percent || 0)));
  const barColor = color || (pct >= 100 ? 'bg-emerald-500' : 'bg-indigo-500');
  return (
    <div className={`w-full ${h} bg-slate-200 rounded-full overflow-hidden`}>
      <div className={`${h} ${barColor} rounded-full transition-all duration-500`} style={{ width: `${pct}%` }} />
    </div>
  );
}

function Badge({ children, tone = 'slate' }) {
  const tones = {
    slate: 'bg-slate-100 text-slate-600',
    indigo: 'bg-indigo-100 text-indigo-700',
    emerald: 'bg-emerald-100 text-emerald-700',
    amber: 'bg-amber-100 text-amber-700',
    red: 'bg-red-100 text-red-700',
    sky: 'bg-sky-100 text-sky-700',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${tones[tone] || tones.slate}`}>{children}</span>;
}

function Avatar({ name, size = 'md', role }) {
  const initial = (name || '?').trim().charAt(0).toUpperCase();
  const sz = size === 'sm' ? 'w-7 h-7 text-xs' : size === 'lg' ? 'w-12 h-12 text-lg' : 'w-9 h-9 text-sm';
  const bg = role === 'instructor' ? 'bg-gradient-to-br from-indigo-500 to-purple-600' : 'bg-gradient-to-br from-sky-400 to-indigo-500';
  return <div className={`${sz} ${bg} rounded-full flex items-center justify-center text-white font-bold shrink-0 select-none`}>{initial}</div>;
}

function EmptyState({ icon = 'BookOpen', title, description, action }) {
  return (
    <div className="flex flex-col items-center justify-center py-14 px-4 text-center">
      <div className="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center mb-4 text-slate-400">
        <Icon name={icon} size={28} />
      </div>
      <div className="text-slate-700 font-medium mb-1">{title}</div>
      {description && <div className="text-sm text-slate-500 max-w-sm mb-4">{description}</div>}
      {action}
    </div>
  );
}

function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative bg-white w-full ${wide ? 'sm:max-w-3xl' : 'sm:max-w-lg'} max-h-[92vh] sm:max-h-[85vh] rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col animate-modal-in`}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
          <h3 className="font-bold text-slate-900 text-base truncate pr-4">{title}</h3>
          <button onClick={onClose} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
            <Icon name="X" size={18} />
          </button>
        </div>
        <div className="overflow-y-auto px-5 py-4 flex-1">{children}</div>
        {footer && <div className="px-5 py-3.5 border-t border-slate-100 bg-slate-50/60 rounded-b-2xl flex justify-end gap-2 shrink-0">{footer}</div>}
      </div>
    </div>
  );
}

function ConfirmDialog({ title, message, confirmLabel = '削除する', tone = 'red', onConfirm, onCancel }) {
  const [busy, setBusy] = useState(false);
  const btnTone = tone === 'red' ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700';
  return (
    <Modal title={title} onClose={onCancel} footer={
      <>
        <button onClick={onCancel} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">キャンセル</button>
        <button
          disabled={busy}
          onClick={async () => { setBusy(true); try { await onConfirm(); } finally { setBusy(false); } }}
          className={`px-4 py-2 rounded-lg text-sm font-bold text-white ${btnTone} transition-colors disabled:opacity-50 flex items-center gap-2`}
        >
          {busy && <Spinner size={14} />}{confirmLabel}
        </button>
      </>
    }>
      <p className="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">{message}</p>
    </Modal>
  );
}

// トースト通知
const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type = 'success') => {
    const id = genId('toast');
    setToasts((prev) => [...prev, { id, message, type }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3500);
  }, []);
  return (
    <ToastContext.Provider value={show}>
      {children}
      <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none px-4 w-full max-w-md">
        {toasts.map((t) => (
          <div key={t.id} className={`pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium animate-toast-in max-w-full ${
            t.type === 'error' ? 'bg-red-600 text-white' : t.type === 'info' ? 'bg-slate-800 text-white' : 'bg-emerald-600 text-white'
          }`}>
            <Icon name={t.type === 'error' ? 'AlertTriangle' : t.type === 'info' ? 'Bell' : 'CheckCircle'} size={16} className="shrink-0" />
            <span className="break-words">{t.message}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast = () => useContext(ToastContext);

// ========== データ層 ==========
const COL = {
  users: 'edu_users',
  courses: 'edu_courses',
  lessons: 'edu_lessons',
  enrollments: 'edu_enrollments',
  quizResults: 'edu_quiz_results',
  comments: 'edu_comments',
  submissions: 'edu_submissions',
  announcements: 'edu_announcements',
};

const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

function AppProvider({ children }) {
  const [authUser, setAuthUser] = useState(undefined); // undefined=判定中, null=未ログイン
  const [users, setUsers] = useState([]);
  const [courses, setCourses] = useState([]);
  const [lessons, setLessons] = useState([]);
  const [enrollments, setEnrollments] = useState([]);
  const [quizResults, setQuizResults] = useState([]);
  const [comments, setComments] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [announcements, setAnnouncements] = useState([]);
  const [usersLoaded, setUsersLoaded] = useState(false);
  const [profileError, setProfileError] = useState(null);
  const [dataError, setDataError] = useState(null);

  // 認証状態の監視
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setAuthUser(u || null));
    return unsub;
  }, []);

  // プロフィール作成（初回ログイン時）: 最初の登録者は講師、それ以降は受講生
  useEffect(() => {
    if (!authUser) return;
    let cancelled = false;
    (async () => {
      try {
        const ref = db.collection(COL.users).doc(authUser.uid);
        const snap = await ref.get();
        if (cancelled) return;
        if (!snap.exists) {
          const probe = await db.collection(COL.users).limit(1).get();
          if (cancelled) return;
          const isFirst = probe.empty;
          await ref.set({
            uid: authUser.uid,
            email: authUser.email || '',
            displayName: authUser.displayName || window.__pendingDisplayName || (authUser.email ? authUser.email.split('@')[0] : 'ユーザー'),
            role: isFirst ? 'instructor' : 'student',
            createdAt: Date.now(),
          });
          delete window.__pendingDisplayName;
        }
      } catch (e) {
        console.error('プロフィール作成エラー', e);
        if (!cancelled) setProfileError(e);
      }
    })();
    return () => { cancelled = true; };
  }, [authUser && authUser.uid]);

  // コレクション購読
  useEffect(() => {
    if (!authUser) {
      setUsers([]); setCourses([]); setLessons([]); setEnrollments([]);
      setQuizResults([]); setComments([]); setSubmissions([]); setAnnouncements([]);
      setUsersLoaded(false);
      return;
    }
    const subs = [];
    const subscribe = (name, setter, onFirst) => {
      const unsub = db.collection(name).onSnapshot(
        (snap) => {
          const arr = [];
          snap.forEach((d) => { const data = d.data(); if (data) arr.push({ id: d.id, ...data }); });
          setter(arr);
          if (onFirst) onFirst();
        },
        (err) => { console.error(`${name} 購読エラー`, err); setDataError(name); }
      );
      subs.push(unsub);
    };
    subscribe(COL.users, setUsers, () => setUsersLoaded(true));
    subscribe(COL.courses, setCourses);
    subscribe(COL.lessons, setLessons);
    subscribe(COL.enrollments, setEnrollments);
    subscribe(COL.quizResults, setQuizResults);
    subscribe(COL.comments, setComments);
    subscribe(COL.submissions, setSubmissions);
    subscribe(COL.announcements, setAnnouncements);
    return () => subs.forEach((u) => { try { u(); } catch (e) {} });
  }, [authUser && authUser.uid]);

  const profile = useMemo(
    () => (authUser ? users.find((u) => u.id === authUser.uid) || null : null),
    [users, authUser]
  );
  const isInstructor = profile && profile.role === 'instructor';

  // ---------- アクション ----------
  // 実Firestoreの set(merge:true) はネストマップを深いマージするため、
  // completedLessons のキー削除が反映されない。常に完全なドキュメントを書き込む。
  // 受講登録が存在する場合のみ更新する（解除済みenrollmentをset()で復活させないためupdate()を使用）
  const touchEnrollment = useCallback(async (courseId, patch) => {
    if (!authUser) return;
    const en = enrollments.find((x) => x.uid === authUser.uid && x.courseId === courseId);
    if (!en) return; // 未受講・受講解除済みなら何もしない
    const id = eid(authUser.uid, courseId);
    const d = new Date();
    const todayKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    await db.collection(COL.enrollments).doc(id).update({
      completedLessons: en.completedLessons || {},
      activityDays: { ...(en.activityDays || {}), [todayKey]: true },
      lastActivityAt: Date.now(),
      ...patch,
    });
  }, [authUser, enrollments]);

  const actions = useMemo(() => ({
    async signOut() { await auth.signOut(); },

    async updateDisplayName(name) {
      if (!authUser) return;
      await db.collection(COL.users).doc(authUser.uid).set({ displayName: name }, { merge: true });
      try { if (auth.currentUser && auth.currentUser.updateProfile) await auth.currentUser.updateProfile({ displayName: name }); } catch (e) {}
    },

    async setUserRole(uid, role) {
      await db.collection(COL.users).doc(uid).set({ role }, { merge: true });
    },

    async createCourse({ title, description, emoji, color, published, certificateEnabled, deadline }) {
      const id = genId('c');
      const inviteCode = Math.random().toString(36).slice(2, 8).toUpperCase();
      await db.collection(COL.courses).doc(id).set({
        title, description: description || '', emoji: emoji || '📘', color: color || '#4f46e5',
        published: !!published, certificateEnabled: !!certificateEnabled, deadline: deadline || null,
        inviteCode, chapters: [],
        createdBy: authUser ? authUser.uid : '', createdAt: Date.now(), updatedAt: Date.now(),
      });
      return id;
    },

    async updateCourse(id, patch) {
      await db.collection(COL.courses).doc(id).set({ ...patch, updatedAt: Date.now() }, { merge: true });
    },

    async regenerateInviteCode(id) {
      const code = Math.random().toString(36).slice(2, 8).toUpperCase();
      await db.collection(COL.courses).doc(id).set({ inviteCode: code, updatedAt: Date.now() }, { merge: true });
      return code;
    },

    async deleteCourse(courseId) {
      const related = [
        ...lessons.filter((l) => l.courseId === courseId).map((l) => [COL.lessons, l.id]),
        ...enrollments.filter((en) => en.courseId === courseId).map((en) => [COL.enrollments, en.id]),
        ...quizResults.filter((r) => r.courseId === courseId).map((r) => [COL.quizResults, r.id]),
        ...comments.filter((c) => c.courseId === courseId).map((c) => [COL.comments, c.id]),
        ...submissions.filter((s) => s.courseId === courseId).map((s) => [COL.submissions, s.id]),
      ];
      for (const [col, id] of related) { await db.collection(col).doc(id).delete(); }
      await db.collection(COL.courses).doc(courseId).delete();
    },

    async createLesson(course, chapterId, title) {
      const id = genId('l');
      const siblings = lessons.filter((l) => l.courseId === course.id && l.chapterId === chapterId);
      const order = siblings.length ? Math.max(...siblings.map((l) => l.order || 0)) + 1 : 1;
      await db.collection(COL.lessons).doc(id).set({
        courseId: course.id, chapterId, title, order,
        blocks: [], quiz: null, assignment: null, updatedAt: Date.now(),
      });
      return id;
    },

    async updateLesson(id, patch) {
      await db.collection(COL.lessons).doc(id).set({ ...patch, updatedAt: Date.now() }, { merge: true });
    },

    async deleteLesson(lesson) {
      const related = [
        ...quizResults.filter((r) => r.lessonId === lesson.id).map((r) => [COL.quizResults, r.id]),
        ...comments.filter((c) => c.lessonId === lesson.id).map((c) => [COL.comments, c.id]),
        ...submissions.filter((s) => s.lessonId === lesson.id).map((s) => [COL.submissions, s.id]),
      ];
      for (const [col, id] of related) { await db.collection(col).doc(id).delete(); }
      await db.collection(COL.lessons).doc(lesson.id).delete();
    },

    async joinCourse(courseId) {
      if (!authUser) return;
      const id = eid(authUser.uid, courseId);
      const snap = await db.collection(COL.enrollments).doc(id).get();
      if (!snap.exists) {
        await db.collection(COL.enrollments).doc(id).set({
          uid: authUser.uid, courseId, joinedAt: Date.now(),
          completedLessons: {}, lastActivityAt: Date.now(),
        });
      }
    },

    // 講師が受講生をコースに割り当てる
    async assignStudents(courseId, uids) {
      for (const uid of uids) {
        const id = eid(uid, courseId);
        const snap = await db.collection(COL.enrollments).doc(id).get();
        if (!snap.exists) {
          await db.collection(COL.enrollments).doc(id).set({
            uid, courseId, joinedAt: Date.now(),
            completedLessons: {}, activityDays: {}, lastActivityAt: null,
          });
        }
      }
    },

    async removeEnrollment(enrollmentId) {
      await db.collection(COL.enrollments).doc(enrollmentId).delete();
    },

    async markLessonComplete(lessonId, courseId) {
      if (!authUser) return;
      const en = enrollments.find((x) => x.uid === authUser.uid && x.courseId === courseId);
      const completed = { ...((en && en.completedLessons) || {}) };
      completed[lessonId] = Date.now();
      await touchEnrollment(courseId, { completedLessons: completed });
    },

    async unmarkLessonComplete(lessonId, courseId) {
      if (!authUser) return;
      const en = enrollments.find((x) => x.uid === authUser.uid && x.courseId === courseId);
      const completed = { ...((en && en.completedLessons) || {}) };
      delete completed[lessonId];
      await touchEnrollment(courseId, { completedLessons: completed });
    },

    async submitQuizResult(lesson, score, passed) {
      if (!authUser) return;
      const id = eid(authUser.uid, lesson.id);
      const prev = quizResults.find((r) => r.id === id);
      const bestScore = Math.max(score, (prev && prev.bestScore) || 0);
      await db.collection(COL.quizResults).doc(id).set({
        uid: authUser.uid, lessonId: lesson.id, courseId: lesson.courseId,
        attempts: ((prev && prev.attempts) || 0) + 1,
        lastScore: score, bestScore,
        passed: !!((prev && prev.passed) || passed),
        firstAttemptAt: (prev && prev.firstAttemptAt) || Date.now(),
        updatedAt: Date.now(),
      });
      if (!passed) {
        await touchEnrollment(lesson.courseId, {});
      }
      if (passed) {
        const en = enrollments.find((x) => x.uid === authUser.uid && x.courseId === lesson.courseId);
        const completed = { ...((en && en.completedLessons) || {}) };
        if (!completed[lesson.id]) {
          completed[lesson.id] = Date.now();
          await touchEnrollment(lesson.courseId, { completedLessons: completed });
        }
      }
    },

    async postComment(lesson, text, parentId) {
      if (!authUser) return;
      const id = genId('cm');
      await db.collection(COL.comments).doc(id).set({
        lessonId: lesson.id, courseId: lesson.courseId,
        uid: authUser.uid, text, parentId: parentId || null, createdAt: Date.now(),
      });
    },

    async deleteQuizResults(lessonId) {
      const related = quizResults.filter((r) => r.lessonId === lessonId);
      for (const r of related) { await db.collection(COL.quizResults).doc(r.id).delete(); }
    },

    async deleteComment(commentId) {
      const children = comments.filter((c) => c.parentId === commentId);
      for (const c of children) { await db.collection(COL.comments).doc(c.id).delete(); }
      await db.collection(COL.comments).doc(commentId).delete();
    },

    async submitAssignment(lesson, text) {
      if (!authUser) return;
      const id = eid(authUser.uid, lesson.id);
      const prev = submissions.find((s) => s.id === id);
      await db.collection(COL.submissions).doc(id).set({
        uid: authUser.uid, lessonId: lesson.id, courseId: lesson.courseId,
        text, submittedAt: Date.now(),
        firstSubmittedAt: (prev && prev.firstSubmittedAt) || Date.now(),
        feedback: (prev && prev.feedback) || null,
      });
      await touchEnrollment(lesson.courseId, {});
    },

    async saveFeedback(submissionId, text) {
      if (!authUser) return;
      await db.collection(COL.submissions).doc(submissionId).set(
        { feedback: { text, by: authUser.uid, at: Date.now() } },
        { merge: true }
      );
    },

    async saveAnnouncement(id, { title, body, pinned }) {
      const docId = id || genId('an');
      await db.collection(COL.announcements).doc(docId).set({
        title, body, pinned: !!pinned,
        createdBy: authUser ? authUser.uid : '',
        ...(id ? { updatedAt: Date.now() } : { createdAt: Date.now() }),
      }, { merge: true });
    },

    async deleteAnnouncement(id) {
      await db.collection(COL.announcements).doc(id).delete();
    },

    // ファイルアップロード: 本番=Firebase Storage / デモ=DataURL(小さいファイルのみ)
    async uploadFile(file, pathHint) {
      if (IS_DEMO) {
        if (file.size > 300 * 1024) throw new Error('デモ版では300KB以下のファイルのみ添付できます（本番版はFirebase Storageを使用）');
        const dataUrl = await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
          fr.readAsDataURL(file);
        });
        return { url: dataUrl, name: file.name, size: file.size, mime: file.type };
      }
      if (!firebase.storage) throw new Error('Firebase Storageが読み込まれていません');
      const path = `edu_uploads/${pathHint}/${Date.now()}_${file.name}`;
      const ref = firebase.storage().ref(path);
      const snap = await ref.put(file);
      const url = await snap.ref.getDownloadURL();
      return { url, name: file.name, size: file.size, mime: file.type };
    },
  }), [authUser, lessons, enrollments, quizResults, comments, submissions, touchEnrollment]);

  const value = {
    authUser, profile, isInstructor, profileError, dataError,
    users, courses, lessons, enrollments, quizResults, comments, submissions, announcements,
    usersLoaded, actions,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

// ---------- 進捗計算ヘルパー ----------
function sortedChaptersOf(course) {
  return [...(course.chapters || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
}
function sortedLessonsOf(course, lessons) {
  const chapters = sortedChaptersOf(course);
  const chapterIndex = {};
  chapters.forEach((ch, i) => { chapterIndex[ch.id] = i; });
  return lessons
    .filter((l) => l.courseId === course.id && chapterIndex[l.chapterId] != null)
    .sort((a, b) => {
      const ci = chapterIndex[a.chapterId] - chapterIndex[b.chapterId];
      if (ci !== 0) return ci;
      return (a.order || 0) - (b.order || 0);
    });
}
function courseProgressOf(course, lessons, enrollment) {
  const ls = sortedLessonsOf(course, lessons);
  const completed = (enrollment && enrollment.completedLessons) || {};
  const done = ls.filter((l) => completed[l.id]).length;
  // 四捨五入で99.5%以上が100%にならないようクランプ（修了判定はpercent>=100で統一されているため）
  const percent = ls.length ? (done >= ls.length ? 100 : Math.min(99, Math.round((done / ls.length) * 100))) : 0;
  return { total: ls.length, done, percent };
}

function AnnouncementList({ manageable }) {
  const { announcements, users, actions } = useApp();
  const toast = useToast();
  const [editing, setEditing] = useState(null); // null | 'new' | announcement
  const [deleting, setDeleting] = useState(null);
  const [showAll, setShowAll] = useState(false);
  const [lastRead] = useState(() => { try { return Number(localStorage.getItem('hakomana:announcements-read') || 0); } catch (e) { return 0; } });
  const announcementsRef = useRef(announcements);
  announcementsRef.current = announcements;
  // 既読化は「実際に表示された後」＝アンマウント時に、実データの最大投稿時刻で記録する
  useEffect(() => {
    return () => {
      try {
        const list = announcementsRef.current || [];
        if (!list.length) return;
        const maxTs = Math.max(...list.map((a) => (tsToDate(a.createdAt) || new Date(0)).getTime()));
        const prev = Number(localStorage.getItem('hakomana:announcements-read') || 0);
        if (maxTs > prev) localStorage.setItem('hakomana:announcements-read', String(maxTs));
      } catch (e) {}
    };
  }, []);

  const sorted = useMemo(() => [...announcements].sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
    return (tsToDate(b.createdAt)?.getTime() || 0) - (tsToDate(a.createdAt)?.getTime() || 0);
  }), [announcements]);
  const visible = showAll ? sorted : sorted.slice(0, 3);

  return (
    <div className="bg-white rounded-2xl border border-slate-100 shadow-sm">
      <div className="flex items-center justify-between px-5 pt-4 pb-2">
        <h2 className="font-bold text-slate-900 flex items-center gap-2"><Icon name="Bell" size={17} className="text-indigo-500" />お知らせ</h2>
        {manageable && (
          <button onClick={() => setEditing('new')} className="flex items-center gap-1 text-xs font-bold text-indigo-600 hover:text-indigo-800 px-2 py-1 rounded-lg hover:bg-indigo-50 transition-colors">
            <Icon name="Plus" size={14} />作成
          </button>
        )}

// コース別の平均進捗（講師ダッシュボード）
function CourseProgressOverview() {
  const { users, courses, lessons, enrollments } = useApp();
  const { nav } = useRoute();
  const rows = useMemo(() => courses
    .map((c) => {
      const ens = enrollments.filter((e) => e.courseId === c.id && users.some((u) => u.id === e.uid && u.role === 'student'));
      const avg = ens.length
        ? Math.round(ens.reduce((s, en) => s + courseProgressOf(c, lessons, en).percent, 0) / ens.length)
        : 0;
      const done = ens.filter((en) => { const p = courseProgressOf(c, lessons, en); return p.total > 0 && p.done >= p.total; }).length;
      return { course: c, count: ens.length, avg, done };
    })
    .filter((r) => r.count > 0)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5), [courses, lessons, enrollments, users]);
  if (!rows.length) return null;
  return (
    <div className="bg-white rounded-2xl border border-slate-100 shadow-sm">
      <div className="px-5 pt-4 pb-2">
        <h2 className="font-bold text-slate-900 flex items-center gap-2"><Icon name="BarChart" size={17} className="text-emerald-500" />コース別の進捗</h2>
      </div>
      <div className="divide-y divide-slate-50">

                <span className="text-sm font-bold text-slate-800 truncate">{course.title}</span>
                <span className="text-[11px] text-slate-400 shrink-0">{count}人受講・{done}人修了</span>
              </div>
              <ProgressBar percent={avg} size="sm" />

            <span className={`text-sm font-bold shrink-0 ${avg >= 100 ? 'text-emerald-600' : 'text-slate-700'}`}>{avg}%</span>
            <Icon name="ChevronRight" size={15} className="text-slate-300 shrink-0" />
          </button>
        ))}

    </div>
  );
}

// 連続学習ストリーク（受講生ダッシュボード）
function StreakCard() {
  const { authUser, enrollments, quizResults, submissions } = useApp();
  const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // 日付が変わったら自動で再計算（0時跨ぎ対策）
  const [todayKey, setTodayKey] = useState(() => dayKey(new Date()));
  useEffect(() => {
    const t = setInterval(() => setTodayKey(dayKey(new Date())), 60000);
    return () => clearInterval(t);
  }, []);
  const days = useMemo(() => {
    const s = new Set();
    const add = (ts) => { const d = tsToDate(ts); if (d) s.add(dayKey(d)); };
    enrollments.filter((e) => e.uid === authUser.uid).forEach((en) => {
      Object.keys(en.activityDays || {}).forEach((k) => s.add(k));
      Object.values(en.completedLessons || {}).forEach(add);
      if (en.lastActivityAt) add(en.lastActivityAt);
    });
    quizResults.filter((r) => r.uid === authUser.uid).forEach((r) => { add(r.updatedAt); add(r.firstAttemptAt); });
    submissions.filter((s2) => s2.uid === authUser.uid).forEach((s2) => { add(s2.submittedAt); add(s2.firstSubmittedAt); });
    return s;
  }, [enrollments, quizResults, submissions, authUser.uid, todayKey]);

  let streak = 0;
  const cursor = new Date();
  if (!days.has(dayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(dayKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }

  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const week = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    week.push({ key: dayKey(d), label: WD[d.getDay()], done: days.has(dayKey(d)), today: i === 0 });
  }

  return (
    <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex items-center justify-between gap-4">
      <div>
        <div className="flex items-center gap-2">
          <span className="text-2xl">🔥</span>
          <span className="text-2xl font-bold text-slate-900">{streak}<span className="text-sm font-bold text-slate-500 ml-1">日連続</span></span>
        </div>
        <div className="text-xs text-slate-400 mt-1">学習した日数 合計{days.size}日</div>
      </div>
      <div className="flex gap-1.5 sm:gap-2.5">
        {week.map((d) => (
          <div key={d.key} className="flex flex-col items-center gap-1">
            <span className={`text-[10px] font-bold ${d.today ? 'text-indigo-600' : 'text-slate-400'}`}>{d.label}</span>
            <div className={`w-6 h-6 sm:w-7 sm:h-7 rounded-lg flex items-center justify-center ${
              d.done ? 'bg-emerald-500 text-white' : d.today ? 'bg-slate-100 border-2 border-dashed border-slate-300' : 'bg-slate-100'
            }`}>
              {d.done && <Icon name="Check" size={13} strokeWidth={3} />}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// 受講期限バッジ
function DeadlineBadge({ course, muted }) {
  const info = deadlineInfo(course);
  if (!info) return null;
  const dateLabel = `${info.date.getMonth() + 1}/${info.date.getDate()}`;
  if (muted) return <Badge tone="slate"><Icon name="Clock" size={11} />期限 {dateLabel}</Badge>;
  if (info.overdue) return <Badge tone="red"><Icon name="AlertTriangle" size={11} />期限超過（{dateLabel}）</Badge>;
  if (info.days === 0) return <Badge tone="amber"><Icon name="Clock" size={11} />期限 {dateLabel}・本日まで</Badge>;
  return <Badge tone={info.days <= 7 ? 'amber' : 'slate'}><Icon name="Clock" size={11} />期限 {dateLabel}・あと{info.days}日</Badge>;
}

function JoinByCodeModal({ onClose }) {
  const { courses, actions } = useApp();
  const { nav } = useRoute();
  const toast = useToast();
  const [code, setCode] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const join = async () => {
    setError('');
    const c = courses.find((x) => (x.inviteCode || '').toUpperCase() === code.trim().toUpperCase());
    if (!c) { setError('この招待コードのコースが見つかりません'); return; }
    setBusy(true);
    try {
      await actions.joinCourse(c.id);
      toast(`「${c.title}」に参加しました`);
      onClose();
      nav('course', { courseId: c.id });
    } catch (e) { console.error(e); setError('参加に失敗しました'); }
    finally { setBusy(false); }
  };
  return (
    <Modal title="招待コードで参加" onClose={onClose} footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || code.trim().length < 4} onClick={join}
          className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}参加する
        </button>
      </>
    }>
      <p className="text-sm text-slate-500 mb-3">講師から共有された6桁の招待コードを入力してください。</p>
      <input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} placeholder="例：AB12CD" maxLength={10}
        onKeyDown={(e) => { if (e.key === 'Enter' && !isComposingEnter(e)) join(); }}
        className="w-full px-3.5 py-3 rounded-xl border border-slate-200 text-center text-lg font-mono font-bold tracking-[0.3em] focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
      {error && <div className="text-xs text-red-600 mt-2 flex items-center gap-1.5"><Icon name="AlertTriangle" size={13} />{error}</div>}
    </Modal>
  );
}

function CourseDetailPage({ courseId }) {
  const { authUser, isInstructor, courses, lessons, enrollments, quizResults, actions } = useApp();
  const { nav, back } = useRoute();
  const toast = useToast();
  const [editingCourse, setEditingCourse] = useState(false);
  const [deletingCourse, setDeletingCourse] = useState(false);
  const [openChapters, setOpenChapters] = useState({});
  const [chapterModal, setChapterModal] = useState(null); // null | {chapter?}
  const [deletingChapter, setDeletingChapter] = useState(null);
  const [lessonModal, setLessonModal] = useState(null); // null | {chapterId, lesson?}
  const [deletingLesson, setDeletingLesson] = useState(null);
  const [busyJoin, setBusyJoin] = useState(false);
  const [showCert, setShowCert] = useState(false);

  const course = courses.find((c) => c.id === courseId);
  if (!course) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100">
        <EmptyState icon="AlertTriangle" title="コースが見つかりません" description="削除された可能性があります"
          action={<button onClick={() => nav('courses')} className="px-4 py-2 rounded-xl bg-slate-800 text-white text-sm font-bold">コース一覧へ</button>} />
      </div>
    );
  }

  const chapters = sortedChaptersOf(course);
  const orderedLessons = sortedLessonsOf(course, lessons);
  const enrollment = enrollments.find((e) => e.uid === authUser.uid && e.courseId === courseId);
  const completed = (enrollment && enrollment.completedLessons) || {};
  const progress = courseProgressOf(course, lessons, enrollment);
  const nextLesson = orderedLessons.find((l) => !completed[l.id]);
  const isEnrolled = !!enrollment;

  const lessonsByChapter = (chId) => orderedLessons.filter((l) => l.chapterId === chId);
  const isChapterOpen = (chId, idx) => openChapters[chId] != null ? openChapters[chId] : true;
  const toggleChapter = (chId, idx) => setOpenChapters((prev) => ({ ...prev, [chId]: !isChapterOpen(chId, idx) }));

  const moveChapter = async (index, dir) => {
    const arr = [...chapters];
    const j = index + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[index], arr[j]] = [arr[j], arr[index]];
    try { await actions.updateCourse(courseId, { chapters: arr.map((ch, i) => ({ ...ch, order: i + 1 })) }); }
    catch (e) { console.error(e); toast('並び替えに失敗しました', 'error'); }
  };
  const moveLesson = async (chapterLessons, index, dir) => {
    const j = index + dir;
    if (j < 0 || j >= chapterLessons.length) return;
    const a = chapterLessons[index], b = chapterLessons[j];
    try {
      await actions.updateLesson(a.id, { order: j + 1 });
      await actions.updateLesson(b.id, { order: index + 1 });
      // 順序の正規化（同順序の重複を避ける）
      for (let i = 0; i < chapterLessons.length; i++) {
        if (i !== index && i !== j && (chapterLessons[i].order || 0) !== i + 1) {
          await actions.updateLesson(chapterLessons[i].id, { order: i + 1 });
        }
      }
    } catch (e) { console.error(e); toast('並び替えに失敗しました', 'error'); }
  };

  return (
    <div className="space-y-4">
      <button onClick={back} className="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 font-medium transition-colors">
        <Icon name="ChevronLeft" size={16} />戻る
      </button>

      {/* コースヘッダー */}
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div className="h-2" style={{ background: course.color }} />
        <div className="p-5">
          <div className="flex items-start gap-4">
            <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shrink-0" style={{ background: `${course.color}18` }}>{course.emoji}</div>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="text-lg font-bold text-slate-900">{course.title}</h1>
                {isInstructor && (course.published
                  ? <Badge tone="emerald"><Icon name="Globe" size={11} />公開中</Badge>
                  : <Badge tone="slate"><Icon name="Lock" size={11} />非公開</Badge>)}
                <DeadlineBadge course={course} muted={isInstructor || (progress.percent >= 100 && progress.total > 0)} />
              </div>
              {course.description && <p className="text-sm text-slate-500 mt-1.5 whitespace-pre-wrap leading-relaxed">{course.description}</p>}
              <div className="text-xs text-slate-400 mt-2 flex items-center gap-1"><Icon name="Layers" size={13} />{chapters.length}章・{orderedLessons.length}レッスン</div>
            </div>
            {isInstructor && (
              <div className="flex gap-1.5 shrink-0">
                <button onClick={() => setEditingCourse(true)} className="p-2 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" title="コースを編集"><Icon name="Edit2" size={17} /></button>
                <button onClick={() => setDeletingCourse(true)} className="p-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-500 transition-colors" title="コースを削除"><Icon name="Trash2" size={17} /></button>
              </div>
            )}
          </div>

          {/* 受講生: 進捗 / 受講開始 */}
          {!isInstructor && (
            isEnrolled ? (
              <div className="mt-4 pt-4 border-t border-slate-100">

                  <span className="text-xs font-bold text-slate-500">進捗 {progress.done}/{progress.total}</span>

          )}

          {/* 講師: 招待コード */}
          {isInstructor && (

                catch (e) { console.error(e); toast('再発行に失敗しました', 'error'); }
              }} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600" title="再発行"><Icon name="RefreshCw" size={15} /></button>
              <span className="text-[11px] text-slate-400">受講生はこのコードでコースに参加できます</span>
            </div>
          )}
        </div>
      </div>

      {/* カリキュラム */}
      {!isInstructor && !isEnrolled && chapters.length > 0 && (
        <div className="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-2.5 text-xs text-indigo-700 flex items-center gap-1.5">
          <Icon name="Lock" size={13} className="shrink-0" />「このコースを受講する」を押すとレッスンを閲覧できるようになります
        </div>
      )}
      <div className="flex items-center justify-between">
        <h2 className="font-bold text-slate-800">カリキュラム</h2>
        {isInstructor && (
          <button onClick={() => setChapterModal({})} className="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition-colors">
            <Icon name="Plus" size={13} />章を追加
          </button>
        )}
      </div>

      {chapters.length === 0 ? (
        <div className="bg-white rounded-2xl border border-slate-100">
          <EmptyState icon="Layers" title="まだカリキュラムがありません"
            description={isInstructor ? '「章を追加」からカリキュラムを作成しましょう' : '講師がコンテンツを準備中です'} />
        </div>
      ) : (
        <div className="space-y-3">
          {chapters.map((ch, chIdx) => {
            const chLessons = lessonsByChapter(ch.id);
            const open = isChapterOpen(ch.id, chIdx);
            const chDone = chLessons.filter((l) => completed[l.id]).length;
            return (
              <div key={ch.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <div className="flex items-center gap-2 px-4 py-3 cursor-pointer hover:bg-slate-50 transition-colors" onClick={() => toggleChapter(ch.id, chIdx)}>
                  <Icon name={open ? 'ChevronDown' : 'ChevronRight'} size={16} className="text-slate-400 shrink-0" />
                  <div className="min-w-0 flex-1">
                    <span className="text-[11px] font-bold text-slate-400 block">第{chIdx + 1}章</span>
                    <span className="font-bold text-sm text-slate-800">{ch.title}</span>
                  </div>
                  {!isInstructor && isEnrolled && chLessons.length > 0 && (
                    <span className={`text-[11px] font-bold shrink-0 ${chDone >= chLessons.length ? 'text-emerald-600' : 'text-slate-400'}`}>{chDone}/{chLessons.length}</span>
                  )}
                  {isInstructor && (
                    <div className="flex items-center gap-0.5 shrink-0" onClick={(e) => e.stopPropagation()}>
                      <button onClick={() => moveChapter(chIdx, -1)} disabled={chIdx === 0} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowUp" size={14} /></button>
                      <button onClick={() => moveChapter(chIdx, 1)} disabled={chIdx === chapters.length - 1} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowDown" size={14} /></button>
                      <button onClick={() => setChapterModal({ chapter: ch })} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600"><Icon name="Edit2" size={14} /></button>
                      <button onClick={() => setDeletingChapter(ch)} className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon name="Trash2" size={14} /></button>
                    </div>
                  )}
                </div>

                {open && (
                  <div className="border-t border-slate-50">
                    {chLessons.length === 0 && (
                      <div className="px-5 py-3 text-xs text-slate-400">{isInstructor ? 'レッスンがありません。下のボタンから追加してください。' : 'レッスン準備中'}</div>
                    )}
                    {chLessons.map((lesson, lIdx) => {
                      const done = !!completed[lesson.id];
                      const hasQuiz = lesson.quiz && (lesson.quiz.questions || []).length > 0;
                      const hasAssignment = lesson.assignment && lesson.assignment.prompt;
                      const qr = quizResults.find((r) => r.uid === authUser.uid && r.lessonId === lesson.id);
                      const clickable = isInstructor || isEnrolled;
                      return (
                        <div key={lesson.id}
                          className={`flex items-center gap-3 px-4 py-3 border-t border-slate-50 first:border-t-0 ${clickable ? 'cursor-pointer hover:bg-indigo-50/40' : 'opacity-70'} transition-colors`}
                          onClick={() => clickable && nav('lesson', { lessonId: lesson.id })}>
                          {!isInstructor ? (
                            done
                              ? <Icon name="CheckCircle" size={19} className="text-emerald-500 shrink-0" />
                              : <Icon name="Circle" size={19} className="text-slate-300 shrink-0" />
                          ) : (
                            <span className="w-5 text-center text-[11px] font-bold text-slate-400 shrink-0">{lIdx + 1}</span>
                          )}
                          <div className="min-w-0 flex-1">
                            <div className="text-sm font-medium text-slate-800 truncate">{lesson.title}</div>
                            <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                              {(lesson.blocks || []).some((b) => b.type === 'video') && <span className="text-[10px] text-slate-400 flex items-center gap-0.5"><Icon name="Video" size={10} />動画</span>}
                              {(lesson.blocks || []).some((b) => b.type === 'file' || b.type === 'link') && <span className="text-[10px] text-slate-400 flex items-center gap-0.5"><Icon name="Paperclip" size={10} />資料</span>}
                              {hasQuiz && <span className="text-[10px] text-amber-600 flex items-center gap-0.5 font-bold"><Icon name="HelpCircle" size={10} />テスト{qr && qr.passed ? '合格' : qr ? `（${qr.bestScore}点）` : ''}</span>}
                              {hasAssignment && <span className="text-[10px] text-sky-600 flex items-center gap-0.5 font-bold"><Icon name="ClipboardList" size={10} />課題</span>}
                            </div>
                          </div>
                          {isInstructor && (
                            <div className="flex items-center gap-0.5 shrink-0" onClick={(e) => e.stopPropagation()}>
                              <button onClick={() => moveLesson(chLessons, lIdx, -1)} disabled={lIdx === 0} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowUp" size={13} /></button>
                              <button onClick={() => moveLesson(chLessons, lIdx, 1)} disabled={lIdx === chLessons.length - 1} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowDown" size={13} /></button>
                              <button onClick={() => setLessonModal({ chapterId: ch.id, lesson })} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600" title="名前を変更"><Icon name="Edit2" size={13} /></button>
                              <button onClick={() => setDeletingLesson(lesson)} className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon name="Trash2" size={13} /></button>
                            </div>
                          )}
                          {!isInstructor && clickable && <Icon name="ChevronRight" size={15} className="text-slate-300 shrink-0" />}
                        </div>
                      );
                    })}
                    {isInstructor && (
                      <button onClick={() => setLessonModal({ chapterId: ch.id })}
                        className="w-full flex items-center gap-2 px-5 py-2.5 text-xs font-bold text-indigo-500 hover:bg-indigo-50/60 border-t border-slate-50 transition-colors">
                        <Icon name="Plus" size={13} />レッスンを追加
                      </button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* モーダル群 */}
      {editingCourse && (
        <CourseModal course={course} onClose={() => setEditingCourse(false)} onSave={async (data) => {
          try { await actions.updateCourse(courseId, data); toast('コースを更新しました'); setEditingCourse(false); }
          catch (e) { console.error(e); toast('更新に失敗しました', 'error'); }
        }} />
      )}
      {deletingCourse && (
        <ConfirmDialog title="コースを削除" message={`「${course.title}」を削除しますか？\nレッスン・受講生の進捗・テスト結果・課題提出・コメントもすべて削除されます。この操作は取り消せません。`}
          onCancel={() => setDeletingCourse(false)}
          onConfirm={async () => {
            try { await actions.deleteCourse(courseId); toast('コースを削除しました'); nav('courses'); }
            catch (e) { console.error(e); toast('削除に失敗しました', 'error'); }
          }} />
      )}
      {chapterModal && (
        <ChapterModal chapter={chapterModal.chapter} onClose={() => setChapterModal(null)} onSave={async (title) => {
          try {
            if (chapterModal.chapter) {
              const updated = (course.chapters || []).map((c) => c.id === chapterModal.chapter.id ? { ...c, title } : c);
              await actions.updateCourse(courseId, { chapters: updated });
              toast('章を更新しました');
            } else {
              const newCh = { id: genId('ch'), title, order: chapters.length + 1 };
              await actions.updateCourse(courseId, { chapters: [...(course.chapters || []), newCh] });
              toast('章を追加しました');
            }
            setChapterModal(null);
          } catch (e) { console.error(e); toast('保存に失敗しました', 'error'); }
        }} />
      )}
      {deletingChapter && (
        <ConfirmDialog title="章を削除" message={`「${deletingChapter.title}」を削除しますか？\nこの章のレッスン（${lessonsByChapter(deletingChapter.id).length}件）もすべて削除されます。`}
          onCancel={() => setDeletingChapter(null)}
          onConfirm={async () => {
            try {
              for (const l of lessonsByChapter(deletingChapter.id)) { await actions.deleteLesson(l); }
              await actions.updateCourse(courseId, { chapters: (course.chapters || []).filter((c) => c.id !== deletingChapter.id) });
              toast('章を削除しました');
              setDeletingChapter(null);
            } catch (e) { console.error(e); toast('削除に失敗しました', 'error'); }
          }} />
      )}
      {lessonModal && (
        <LessonTitleModal lesson={lessonModal.lesson} onClose={() => setLessonModal(null)} onSave={async (title) => {
          try {
            if (lessonModal.lesson) {
              await actions.updateLesson(lessonModal.lesson.id, { title });
              toast('レッスン名を変更しました');
              setLessonModal(null);
            } else {
              const id = await actions.createLesson(course, lessonModal.chapterId, title);
              toast('レッスンを追加しました');
              setLessonModal(null);
              nav('lesson', { lessonId: id });
            }
          } catch (e) { console.error(e); toast('保存に失敗しました', 'error'); }
        }} />
      )}
      {showCert && <CertificateModal course={course} onClose={() => setShowCert(false)} />}
      {deletingLesson && (
        <ConfirmDialog title="レッスンを削除" message={`「${deletingLesson.title}」を削除しますか？\n受講生のテスト結果・課題提出・コメントも削除されます。`}
          onCancel={() => setDeletingLesson(null)}
          onConfirm={async () => {
            try { await actions.deleteLesson(deletingLesson); toast('レッスンを削除しました'); setDeletingLesson(null); }
            catch (e) { console.error(e); toast('削除に失敗しました', 'error'); }
          }} />
      )}
    </div>
  );
}

// 修了証モーダル（印刷対応）
function CertificateModal({ course, onClose }) {
  const { authUser, profile, users, enrollments, lessons } = useApp();
  const enrollment = enrollments.find((e) => e.uid === authUser.uid && e.courseId === course.id);
  const instructor = users.find((u) => u.id === course.createdBy);
  const completedDates = Object.values((enrollment && enrollment.completedLessons) || {}).map(tsToDate).filter(Boolean);
  const doneDate = completedDates.length ? new Date(Math.max(...completedDates.map((d) => d.getTime()))) : new Date();
  const dateStr = `${doneDate.getFullYear()}年${doneDate.getMonth() + 1}月${doneDate.getDate()}日`;
  const lessonCount = sortedLessonsOf(course, lessons).length;
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
      <style>{`@media print { html, body { height: auto !important; overflow: hidden !important; } body * { visibility: hidden !important; } #hakomana-certificate, #hakomana-certificate * { visibility: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } #hakomana-certificate { position: fixed !important; inset: 0 !important; border-radius: 0 !important; box-shadow: none !important; } }`}</style>
      <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-full max-w-2xl my-auto">
        <div id="hakomana-certificate" className="bg-white rounded-2xl shadow-2xl p-3">
          <div className="border-4 border-double rounded-xl px-6 py-10 sm:px-12 sm:py-14 text-center" style={{ borderColor: course.color }}>
            <div className="inline-flex w-14 h-14 rounded-full items-center justify-center text-white mb-5" style={{ background: course.color }}>
              <Icon name="GraduationCap" size={30} />
            </div>
            <div className="text-2xl sm:text-3xl font-bold text-slate-900 tracking-[0.5em] pl-[0.5em] mb-8">修了証</div>
            <div className="text-lg font-bold text-slate-900 border-b-2 border-slate-300 inline-block px-8 pb-1.5 mb-6">{profile.displayName} 殿</div>
            <p className="text-sm text-slate-600 leading-relaxed mb-8 max-w-md mx-auto">
              あなたは「<span className="font-bold text-slate-800">{course.title}</span>」の全カリキュラム（全{lessonCount}レッスン）を修了されました。その努力と成果をここに証します。
            </p>
            <div className="text-sm text-slate-700 font-bold">修了日　{dateStr}</div>
            <div className="text-xs text-slate-400 mt-5">発行：{instructor ? instructor.displayName : '講師'}｜ハコマナ 研修・教育プラットフォーム</div>
          </div>
        </div>
        <div className="flex justify-center gap-2 mt-4">
          <button onClick={() => window.print()}
            className="px-5 py-2.5 rounded-xl bg-white text-slate-700 text-sm font-bold hover:bg-slate-100 transition-colors flex items-center gap-1.5 shadow">
            <Icon name="Download" size={15} />印刷 / PDF保存
          </button>
          <button onClick={onClose} className="px-5 py-2.5 rounded-xl bg-slate-800 text-white text-sm font-bold hover:bg-slate-700 transition-colors">閉じる</button>
        </div>
      </div>
    </div>
  );
}

function ChapterModal({ chapter, onClose, onSave }) {
  const [title, setTitle] = useState(chapter ? chapter.title : '');
  const [busy, setBusy] = useState(false);
  return (
    <Modal title={chapter ? '章の名前を変更' : '章を追加'} onClose={onClose} footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || !title.trim()} onClick={async () => { setBusy(true); try { await onSave(title.trim()); } finally { setBusy(false); } }}
          className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}保存
        </button>
      </>
    }>
      <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="例：第1章 はじめに" autoFocus
        onKeyDown={(e) => { if (e.key === 'Enter' && !isComposingEnter(e) && title.trim()) onSave(title.trim()); }}
        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
    </Modal>
  );
}

function LessonTitleModal({ lesson, onClose, onSave }) {
  const [title, setTitle] = useState(lesson ? lesson.title : '');
  const [busy, setBusy] = useState(false);
  return (
    <Modal title={lesson ? 'レッスン名を変更' : 'レッスンを追加'} onClose={onClose} footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || !title.trim()} onClick={async () => { setBusy(true); try { await onSave(title.trim()); } finally { setBusy(false); } }}
          className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}{lesson ? '保存' : '追加して編集へ'}

}

// ========== レッスン ==========
function LessonPage({ lessonId, initialTab }) {
  const { authUser, isInstructor, courses, lessons, enrollments, actions } = useApp();
  const { nav, back } = useRoute();
  const toast = useToast();
  const [tab, setTab] = useState(initialTab || 'edit');

  const lesson = lessons.find((l) => l.id === lessonId);
  const course = lesson ? courses.find((c) => c.id === lesson.courseId) : null;

  useEffect(() => { setTab(initialTab || 'edit'); }, [lessonId, initialTab]);

  if (!lesson || !course) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100">
        <EmptyState icon="AlertTriangle" title="レッスンが見つかりません" description="削除された可能性があります"
          action={<button onClick={() => nav('courses')} className="px-4 py-2 rounded-xl bg-slate-800 text-white text-sm font-bold">コース一覧へ</button>} />
      </div>
    );
  }

  const orderedLessons = sortedLessonsOf(course, lessons);
  const idx = orderedLessons.findIndex((l) => l.id === lessonId);
  const prevLesson = idx > 0 ? orderedLessons[idx - 1] : null;
  const nextLesson = idx >= 0 && idx < orderedLessons.length - 1 ? orderedLessons[idx + 1] : null;
  const chapter = (course.chapters || []).find((c) => c.id === lesson.chapterId);

  if (isInstructor) {
    const tabs = [
      { key: 'edit', label: '編集', icon: 'Edit2' },
      { key: 'preview', label: 'プレビュー', icon: 'Eye' },
      { key: 'submissions', label: '提出物', icon: 'ClipboardList' },
      { key: 'comments', label: '質問・コメント', icon: 'MessageCircle' },
    ];
    return (
      <div className="space-y-4">
        <button onClick={back} className="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 font-medium transition-colors">
          <Icon name="ChevronLeft" size={16} />{course.title}
        </button>
        <div>
          <div className="text-xs text-slate-400 font-bold">{chapter ? chapter.title : ''}</div>
          <h1 className="text-xl font-bold text-slate-900 mt-0.5">{lesson.title}</h1>
        </div>
        <div className="flex gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
          {tabs.map((t) => (
            <button key={t.key} onClick={() => setTab(t.key)}
              className={`flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition-all ${tab === t.key ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
              <Icon name={t.icon} size={14} />{t.label}
            </button>
          ))}
        </div>
        {tab === 'edit' && <LessonEditor lesson={lesson} course={course} />}
        {tab === 'preview' && (
          <div className="space-y-4">
            <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs font-bold rounded-xl px-4 py-2.5 flex items-center gap-2">
              <Icon name="Eye" size={14} />受講生にはこのように表示されます
            </div>
            <LessonContentView lesson={lesson} course={course} instructorPreview={true} />
          </div>
        )}
        {tab === 'submissions' && <SubmissionsTab lesson={lesson} />}
        {tab === 'comments' && (
          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <CommentsSection lesson={lesson} />
          </div>
        )}
      </div>
    );
  }

  // ----- 受講生ビュー -----
  return <StudentLessonView lesson={lesson} course={course} chapter={chapter} prevLesson={prevLesson} nextLesson={nextLesson} lessonNumber={idx + 1} totalLessons={orderedLessons.length} />;
}

function StudentLessonView({ lesson, course, chapter, prevLesson, nextLesson, lessonNumber, totalLessons }) {
  const { authUser, enrollments, quizResults, actions } = useApp();
  const { nav, back } = useRoute();
  const toast = useToast();
  const [busyComplete, setBusyComplete] = useState(false);

  const enrollment = enrollments.find((e) => e.uid === authUser.uid && e.courseId === course.id);
  const completed = (enrollment && enrollment.completedLessons) || {};
  const isDone = !!completed[lesson.id];
  const hasQuiz = lesson.quiz && (lesson.quiz.questions || []).length > 0;
  const myQuizResult = quizResults.find((r) => r.uid === authUser.uid && r.lessonId === lesson.id);
  const quizPassed = !!(myQuizResult && myQuizResult.passed);
  const hasAssignment = lesson.assignment && lesson.assignment.prompt;

  if (!enrollment) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100">
        <EmptyState icon="Lock" title="このレッスンを見るには受講登録が必要です"
          action={<button onClick={() => nav('course', { courseId: course.id })} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">コースページへ</button>} />
      </div>
    );
  }

  const toggleComplete = async () => {
    setBusyComplete(true);
    try {
      if (isDone) {
        await actions.unmarkLessonComplete(lesson.id, course.id);
        toast('完了を取り消しました', 'info');
      } else {
        await actions.markLessonComplete(lesson.id, course.id);
        toast('レッスンを完了しました！');
      }
    } catch (e) { console.error(e); toast('更新に失敗しました', 'error'); }
    finally { setBusyComplete(false); }
  };

  return (
    <div className="space-y-4 max-w-3xl mx-auto">
      <button onClick={back} className="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 font-medium transition-colors">
        <Icon name="ChevronLeft" size={16} />{course.title}
      </button>

      <div>
        <div className="flex items-center gap-2 text-xs text-slate-400 font-bold">
          <span>{chapter ? chapter.title : ''}</span>
          <span>・</span>
          <span>{lessonNumber}/{totalLessons}</span>

// ---------- 理解度テスト（受講生） ----------
function gradeQuiz(quiz, answers) {
  const questions = quiz.questions || [];
  let correct = 0;
  const detail = questions.map((q) => {
    const correctIds = (q.choices || []).filter((c) => c.correct).map((c) => c.id).sort();
    const userIds = [...(answers[q.id] || [])].sort();
    const isCorrect = correctIds.length > 0 && correctIds.length === userIds.length && correctIds.every((id, i) => id === userIds[i]);
    if (isCorrect) correct++;
    return { question: q, isCorrect, userIds };
  });
  const score = questions.length ? Math.round((correct / questions.length) * 100) : 0;
  return { score, correct, total: questions.length, detail, passed: score >= (quiz.passScore || 0) };
}

function QuizSection({ lesson }) {
  const { authUser, quizResults, actions } = useApp();
  const toast = useToast();
  const quiz = lesson.quiz;
  const questions = quiz.questions || [];
  const [phase, setPhase] = useState('intro'); // intro | taking | result
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => { setPhase('intro'); setAnswers({}); setResult(null); }, [lesson.id]);

  const myResult = quizResults.find((r) => r.uid === authUser.uid && r.lessonId === lesson.id);
  const allAnswered = questions.every((q) => (answers[q.id] || []).length > 0);

  const selectAnswer = (q, choiceId) => {
    setAnswers((prev) => {
      const cur = prev[q.id] || [];
      if (q.type === 'multi') {
        return { ...prev, [q.id]: cur.includes(choiceId) ? cur.filter((x) => x !== choiceId) : [...cur, choiceId] };
      }
      return { ...prev, [q.id]: [choiceId] };
    });
  };

  const submit = async () => {
    const r = gradeQuiz(quiz, answers);
    setResult(r);
    setPhase('result');
    setBusy(true);
    try { await actions.submitQuizResult(lesson, r.score, r.passed); }
    catch (e) { console.error(e); toast('結果の保存に失敗しました', 'error'); }
    finally { setBusy(false); }
    window.scrollTo(0, 0);
  };

  return (
    <div className="bg-white rounded-2xl border-2 border-amber-200 shadow-sm overflow-hidden">
      <div className="bg-amber-50 px-5 py-3 flex items-center gap-2 border-b border-amber-100">

            </div>
            <div className="bg-slate-50 rounded-xl p-3 text-center">
              <div className="text-lg font-bold text-slate-800">{myResult ? `${myResult.bestScore}` : '—'}<span className="text-xs">{myResult ? '点' : ''}</span></div>
              <div className="text-[11px] text-slate-400">ベストスコア</div>
            </div>
          </div>

            <div className="text-xs text-amber-600 bg-amber-50 rounded-lg px-3 py-2 mb-3 flex items-center gap-1.5">

            </div>
          )}
          <button onClick={() => { setPhase('taking'); setAnswers({}); }}
            className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold transition-colors flex items-center justify-center gap-2">
            <Icon name="Play" size={15} />{myResult ? 'もう一度挑戦する' : 'テストを開始する'}
          </button>
        </div>
      )}

      {phase === 'taking' && (
        <div className="p-5 space-y-5">
          {questions.map((q, qi) => (
            <div key={q.id}>
              <div className="flex items-start gap-2 mb-2.5">
                <span className="shrink-0 w-6 h-6 rounded-lg bg-amber-100 text-amber-700 text-xs font-bold flex items-center justify-center mt-0.5">{qi + 1}</span>

                  <div className="text-sm font-bold text-slate-800 leading-relaxed">{q.text}</div>

                {(q.choices || []).map((c) => {

            <div className="text-xs text-slate-400 mt-1">{result.correct}/{result.total} 問正解</div>

          <div className="space-y-4 mb-5">
            {result.detail.map(({ question: q, isCorrect, userIds }, qi) => (

                <div className="flex items-start gap-2">

                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-bold text-slate-800">{qi + 1}. {q.text}</div>
                    <div className="mt-2 space-y-1">
                      {(q.choices || []).map((c) => {
                        const chosen = userIds.includes(c.id);
                        return (
