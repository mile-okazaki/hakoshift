    setBusy(true);
    try {
      await actions.postComment(lesson, content.trim(), parentId);
      if (parentId) { setReplyTo(null); setReplyText(''); } else { setText(''); }
      toast('投稿しました');
    } catch (e) { console.error(e); toast('投稿に失敗しました', 'error'); }
    finally { setBusy(false); }
  };

  const renderComment = (comment, isReply) => {
    const author = users.find((u) => u.id === comment.uid);
    const isAuthorInstructor = author && author.role === 'instructor';
    const canDelete = comment.uid === authUser.uid || isInstructor;
    return (
      <div className={`flex gap-3 ${isReply ? 'ml-10 mt-3' : ''}`}>
        <Avatar name={author ? author.displayName : '?'} size="sm" role={author ? author.role : 'student'} />
        <div className="min-w-0 flex-1">
          <div className="bg-slate-50 rounded-xl px-3.5 py-2.5">
            <div className="flex items-center gap-1.5 flex-wrap">
              <span className="text-xs font-bold text-slate-700">{author ? author.displayName : '退会済みユーザー'}</span>
              {isAuthorInstructor && <Badge tone="indigo">講師</Badge>}
              <span className="text-[10px] text-slate-400">{fmtRelative(comment.createdAt)}</span>
            </div>
            <p className="text-sm text-slate-700 mt-1 whitespace-pre-wrap leading-relaxed">{comment.text}</p>
          </div>
          <div className="flex items-center gap-3 mt-1 pl-1">
            {!isReply && (
              <button onClick={() => { setReplyTo(replyTo === comment.id ? null : comment.id); setReplyText(''); }}
                className="text-[11px] font-bold text-slate-400 hover:text-indigo-600">返信</button>
            )}
            {canDelete && (
              <button onClick={() => setDeleting(comment)} className="text-[11px] font-bold text-slate-400 hover:text-red-500">削除</button>
            )}
          </div>
          {replyTo === comment.id && (
            <div className="flex gap-2 mt-2">
              <input value={replyText} onChange={(e) => setReplyText(e.target.value)} placeholder="返信を入力..."
                onKeyDown={(e) => { if (e.key === 'Enter' && !isComposingEnter(e) && replyText.trim() && !busy) post(replyText, comment.id); }}
                className="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" autoFocus />
              <button disabled={busy || !replyText.trim()} onClick={() => post(replyText, comment.id)}
                className="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 disabled:opacity-50 shrink-0">送信</button>
            </div>
          )}
          {childrenOf(comment.id).map((child) => <Fragment key={child.id}>{renderComment(child, true)}</Fragment>)}
        </div>
      </div>
    );
  };

  return (
    <div>
      <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2 mb-4">
        <Icon name="MessageCircle" size={16} className="text-indigo-500" />質問・コメント
        {lessonComments.length > 0 && <span className="text-xs text-slate-400 font-normal">{lessonComments.length}件</span>}
      </h3>
      <div className="space-y-4 mb-5">
        {roots.length === 0 && <div className="text-sm text-slate-400 text-center py-4">まだコメントはありません。わからないことは気軽に質問しましょう。</div>}
        {roots.map((c) => <Fragment key={c.id}>{renderComment(c, false)}</Fragment>)}
      </div>
      <div className="flex gap-2">
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={2} placeholder={isInstructor ? 'コメントを入力...' : '質問や感想を入力...'}
          className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 resize-none" />
        <button disabled={busy || !text.trim()} onClick={() => post(text, null)}
          className="self-end px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-1.5 shrink-0">
          {busy ? <Spinner size={13} /> : <Icon name="Send" size={13} />}投稿
        </button>
      </div>
      {deleting && (
        <ConfirmDialog title="コメントを削除" message="このコメントを削除しますか？返信も一緒に削除されます。"
          onCancel={() => setDeleting(null)}
          onConfirm={async () => {
            try { await actions.deleteComment(deleting.id); toast('削除しました'); setDeleting(null); }
            catch (e) { console.error(e); toast('削除に失敗しました', 'error'); }
          }} />
      )}
    </div>
  );
}

// ========== レッスン編集（講師） ==========
const BLOCK_TYPES = [
  { type: 'text', label: 'テキスト', icon: 'FileText', desc: '本文・説明文を記入', color: 'text-slate-500 bg-slate-50' },
  { type: 'video', label: '動画', icon: 'Video', desc: 'YouTube / Vimeo を埋め込み', color: 'text-red-500 bg-red-50' },
  { type: 'link', label: 'リンク', icon: 'Link', desc: '外部資料へのリンク', color: 'text-sky-500 bg-sky-50' },
  { type: 'file', label: 'ファイル', icon: 'Paperclip', desc: 'PDF・画像などを添付', color: 'text-indigo-500 bg-indigo-50' },
];

function LessonEditor({ lesson, course }) {
  const { actions } = useApp();
  const toast = useToast();
  const [addMenuOpen, setAddMenuOpen] = useState(false);
  const [editingBlock, setEditingBlock] = useState(null); // {block?, type}
  const [deletingBlock, setDeletingBlock] = useState(null);
  const blocks = lesson.blocks || [];

  const saveBlocks = async (newBlocks, message) => {
    try { await actions.updateLesson(lesson.id, { blocks: newBlocks }); if (message) toast(message); }
    catch (e) { console.error(e); toast('保存に失敗しました', 'error'); }
  };

  const moveBlock = (index, dir) => {
    const j = index + dir;
    if (j < 0 || j >= blocks.length) return;
    const arr = [...blocks];
    [arr[index], arr[j]] = [arr[j], arr[index]];
    saveBlocks(arr);
  };

  const blockSummary = (b) => {
    if (b.type === 'text') return (b.content || '').slice(0, 60) || '（空のテキスト）';
    if (b.type === 'video') return b.url;
    if (b.type === 'link') return `${b.label || ''} ${b.url}`;
    if (b.type === 'file') return `${b.name}（${fmtSize(b.size)}）`;
    return '';
  };

  return (
    <div className="space-y-4">
      {/* コンテンツブロック */}
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div className="px-5 pt-4 pb-2 flex items-center justify-between">
          <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2"><Icon name="FileText" size={16} className="text-indigo-500" />コンテンツ</h2>
          <span className="text-[11px] text-slate-400">{blocks.length}ブロック</span>
        </div>
        {blocks.length === 0 && (
          <div className="px-5 py-3 text-sm text-slate-400">まだコンテンツがありません。下のボタンから追加してください。</div>
        )}
        <div className="divide-y divide-slate-50">
          {blocks.map((b, i) => {
            const meta = BLOCK_TYPES.find((t) => t.type === b.type) || BLOCK_TYPES[0];
            return (
              <div key={b.id} className="flex items-center gap-3 px-5 py-3">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${meta.color}`}><Icon name={meta.icon} size={17} /></div>
                <div className="min-w-0 flex-1 cursor-pointer" onClick={() => setEditingBlock({ block: b, type: b.type })}>
                  <div className="text-xs font-bold text-slate-500">{meta.label}</div>
                  <div className="text-sm text-slate-700 truncate">{blockSummary(b)}</div>
                </div>
                <div className="flex items-center gap-0.5 shrink-0">
                  <button onClick={() => moveBlock(i, -1)} disabled={i === 0} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowUp" size={14} /></button>
                  <button onClick={() => moveBlock(i, 1)} disabled={i === blocks.length - 1} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowDown" size={14} /></button>
                  <button onClick={() => setEditingBlock({ block: b, type: b.type })} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600"><Icon name="Edit2" size={14} /></button>
                  <button onClick={() => setDeletingBlock(b)} className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon name="Trash2" size={14} /></button>
                </div>
              </div>
            );
          })}
        </div>
        <div className="p-4 border-t border-slate-50 relative">
          <button onClick={() => setAddMenuOpen((v) => !v)}
            className="w-full flex items-center justify-center gap-1.5 py-2.5 rounded-xl border-2 border-dashed border-slate-200 text-slate-400 text-sm font-bold hover:border-indigo-300 hover:text-indigo-500 transition-colors">
            <Icon name="Plus" size={16} />コンテンツを追加
          </button>
          {addMenuOpen && (
            <>
              <div className="fixed inset-0 z-30" onClick={() => setAddMenuOpen(false)} />
              <div className="absolute bottom-16 left-4 right-4 z-40 bg-white rounded-2xl shadow-xl border border-slate-100 p-2 grid grid-cols-2 gap-1 animate-modal-in">
                {BLOCK_TYPES.map((t) => (
                  <button key={t.type} onClick={() => { setAddMenuOpen(false); setEditingBlock({ type: t.type }); }}
                    className="flex items-center gap-2.5 p-3 rounded-xl hover:bg-slate-50 text-left transition-colors">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${t.color}`}><Icon name={t.icon} size={17} /></div>
                    <div className="min-w-0">
                      <div className="text-xs font-bold text-slate-700">{t.label}</div>
                      <div className="text-[10px] text-slate-400 truncate">{t.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      </div>

      <QuizBuilder lesson={lesson} />
      <AssignmentEditor lesson={lesson} />

      {editingBlock && (
        <BlockEditModal
          type={editingBlock.type}
          block={editingBlock.block}
          lesson={lesson}
          onClose={() => setEditingBlock(null)}
          onSave={async (data) => {
            if (editingBlock.block) {
              await saveBlocks(blocks.map((b) => b.id === editingBlock.block.id ? { ...b, ...data } : b), '更新しました');
            } else {
              await saveBlocks([...blocks, { id: genId('b'), type: editingBlock.type, ...data }], '追加しました');
            }
            setEditingBlock(null);
          }}
        />
      )}
      {deletingBlock && (
        <ConfirmDialog title="ブロックを削除" message="このコンテンツブロックを削除しますか？"
          onCancel={() => setDeletingBlock(null)}
          onConfirm={async () => { await saveBlocks(blocks.filter((b) => b.id !== deletingBlock.id), '削除しました'); setDeletingBlock(null); }} />
      )}
    </div>
  );
}

function BlockEditModal({ type, block, lesson, onClose, onSave }) {
  const { actions } = useApp();
  const toast = useToast();
  const [content, setContent] = useState(block ? block.content || '' : '');
  const [url, setUrl] = useState(block ? block.url || '' : '');
  const [label, setLabel] = useState(block ? block.label || '' : '');
  const [file, setFile] = useState(block ? { name: block.name, url: block.url, size: block.size, mime: block.mime } : null);
  const [uploading, setUploading] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);
  const meta = BLOCK_TYPES.find((t) => t.type === type) || BLOCK_TYPES[0];

  const canSave = type === 'text' ? content.trim().length > 0
    : type === 'video' ? url.trim().length > 0
    : type === 'link' ? url.trim().length > 0
    : !!(file && file.url);

  const handleFileSelect = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    setUploading(true);
    try {
      const uploaded = await actions.uploadFile(f, `${lesson.courseId}/${lesson.id}`);
      setFile(uploaded);
      toast('アップロードしました');
    } catch (e) {
      console.error(e);
      toast(e.message || 'アップロードに失敗しました', 'error');
    } finally {
      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  const save = async () => {
    setBusy(true);
    try {
      if (type === 'text') await onSave({ content: content });
      else if (type === 'video') await onSave({ url: url.trim() });
      else if (type === 'link') await onSave({ url: url.trim(), label: label.trim() });
      else if (type === 'file') await onSave({ name: file.name, url: file.url, size: file.size, mime: file.mime || '' });
    } finally { setBusy(false); }
  };

  const embed = type === 'video' ? toEmbedUrl(url.trim()) : null;

  return (
    <Modal title={`${meta.label}${block ? 'を編集' : 'を追加'}`} onClose={onClose} wide={type === 'text'} footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || !canSave} onClick={save}
          className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}保存
        </button>
      </>
    }>
      {type === 'text' && (
        <div>
          <textarea value={content} onChange={(e) => setContent(e.target.value)} rows={12} placeholder={'本文を入力...\n\n# 大見出し\n## 小見出し\n- 箇条書き\n**強調**'}
            className="w-full px-3.5 py-3 rounded-xl border border-slate-200 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500/40 resize-y font-mono" />
          <div className="text-[11px] text-slate-400 mt-2 flex items-center gap-1.5 flex-wrap">
            <Icon name="Sparkles" size={12} />
            書式：<code className="bg-slate-100 px-1 rounded"># 見出し</code>
            <code className="bg-slate-100 px-1 rounded">## 小見出し</code>
            <code className="bg-slate-100 px-1 rounded">- 箇条書き</code>
            <code className="bg-slate-100 px-1 rounded">**強調**</code>・URLは自動リンク
          </div>
          {content.trim() && (
            <div className="mt-3 border border-slate-100 rounded-xl p-4 bg-slate-50/50">
              <div className="text-[10px] font-bold text-slate-400 mb-2">プレビュー</div>
              <RichText text={content} />
            </div>
          )}
        </div>
      )}
      {type === 'video' && (
        <div className="space-y-3">
          <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=..."
            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          <p className="text-[11px] text-slate-400">YouTube・Vimeo のURLを貼り付けると埋め込みプレーヤーで表示されます。その他のURLはリンクとして表示されます。</p>
          {embed && (
            <div className="relative w-full rounded-xl overflow-hidden" style={{ paddingTop: '56.25%' }}>
              <iframe src={embed} title="プレビュー" className="absolute inset-0 w-full h-full" frameBorder="0" allowFullScreen />
            </div>
          )}
        </div>
      )}
      {type === 'link' && (
        <div className="space-y-3">
          <div>
            <label className="block text-xs font-bold text-slate-500 mb-1.5">表示名</label>
            <input value={label} onChange={(e) => setLabel(e.target.value)} placeholder="例：配送マニュアル（Google ドライブ）"
              className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
          <div>
            <label className="block text-xs font-bold text-slate-500 mb-1.5">URL <span className="text-red-500">*</span></label>
            <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://..."
              className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
        </div>
      )}
      {type === 'file' && (
        <div className="space-y-3">
          <input ref={fileInputRef} type="file" onChange={handleFileSelect} className="hidden" id="block-file-input" />
          {file && file.url ? (
            <div className="flex items-center gap-3 bg-indigo-50 rounded-xl p-4">
              <Icon name="Paperclip" size={20} className="text-indigo-500 shrink-0" />
              <div className="min-w-0 flex-1">
                <div className="text-sm font-bold text-slate-700 truncate">{file.name}</div>
                <div className="text-xs text-slate-400">{fmtSize(file.size)}</div>
              </div>
              <button onClick={() => setFile(null)} className="p-1.5 rounded-lg text-slate-400 hover:bg-white hover:text-red-500 shrink-0"><Icon name="X" size={16} /></button>
            </div>
          ) : (
            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={uploading}
              className="w-full flex flex-col items-center gap-2 py-8 rounded-xl border-2 border-dashed border-slate-200 text-slate-400 hover:border-indigo-300 hover:text-indigo-500 transition-colors disabled:opacity-50">
              {uploading ? <Spinner size={24} /> : <Icon name="Upload" size={24} />}
              <span className="text-sm font-bold">{uploading ? 'アップロード中...' : 'ファイルを選択'}</span>
              <span className="text-[11px]">{IS_DEMO ? 'デモ版は300KBまで' : 'PDF・画像・Officeファイルなど'}</span>
            </button>
          )}
        </div>
      )}
    </Modal>
  );
}

// ---------- テストビルダー ----------
function QuizBuilder({ lesson }) {
  const { actions } = useApp();
  const toast = useToast();
  const quiz = lesson.quiz;
  const [questionModal, setQuestionModal] = useState(null); // {question?} | null
  const [deletingQuestion, setDeletingQuestion] = useState(null);
  const [removingQuiz, setRemovingQuiz] = useState(false);

  const saveQuiz = async (newQuiz, message) => {
    try { await actions.updateLesson(lesson.id, { quiz: newQuiz }); if (message) toast(message); }
    catch (e) { console.error(e); toast('保存に失敗しました', 'error'); }
  };

  if (!quiz) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 flex items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center shrink-0"><Icon name="HelpCircle" size={20} /></div>
          <div>
            <div className="font-bold text-slate-800 text-sm">理解度テスト</div>
            <div className="text-xs text-slate-400 mt-0.5">テストを追加すると、合格したときにレッスン完了になります</div>
          </div>
        </div>
        <button onClick={() => saveQuiz({ passScore: 80, questions: [] }, 'テストを追加しました。問題を作成してください。')}
          className="shrink-0 flex items-center gap-1 px-3.5 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold hover:bg-amber-600 transition-colors">
          <Icon name="Plus" size={14} />追加
        </button>
      </div>
    );
  }

  const questions = quiz.questions || [];
  const moveQuestion = (index, dir) => {
    const j = index + dir;
    if (j < 0 || j >= questions.length) return;
    const arr = [...questions];
    [arr[index], arr[j]] = [arr[j], arr[index]];
    saveQuiz({ ...quiz, questions: arr });
  };

  return (
    <div className="bg-white rounded-2xl border-2 border-amber-200 shadow-sm overflow-hidden">
      <div className="bg-amber-50 px-5 py-3 flex items-center justify-between gap-2 border-b border-amber-100">
        <span className="font-bold text-slate-800 text-sm flex items-center gap-2"><Icon name="HelpCircle" size={17} className="text-amber-500" />理解度テスト</span>
        <button onClick={() => setRemovingQuiz(true)} className="text-[11px] font-bold text-slate-400 hover:text-red-500">テストを削除</button>
      </div>
      <div className="p-5 space-y-4">
        <div className="flex items-center gap-3">
          <label className="text-xs font-bold text-slate-500">合格ライン</label>
          <select value={quiz.passScore || 80} onChange={(e) => saveQuiz({ ...quiz, passScore: Number(e.target.value) }, '合格ラインを変更しました')}
            className="px-3 py-1.5 rounded-lg border border-slate-200 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40">
            {[100, 90, 80, 70, 60, 50].map((v) => <option key={v} value={v}>{v}点</option>)}
          </select>
          <span className="text-[11px] text-slate-400">正答率がこの値以上で合格</span>
        </div>

        {questions.length === 0 && (
          <div className="text-sm text-slate-400 bg-slate-50 rounded-xl px-4 py-3">問題がまだありません。「問題を追加」から作成してください。</div>
        )}
        <div className="space-y-2">
          {questions.map((q, qi) => (
            <div key={q.id} className="flex items-center gap-2.5 border border-slate-100 rounded-xl px-3.5 py-2.5">
              <span className="shrink-0 w-6 h-6 rounded-lg bg-amber-100 text-amber-700 text-xs font-bold flex items-center justify-center">{qi + 1}</span>
              <div className="min-w-0 flex-1 cursor-pointer" onClick={() => setQuestionModal({ question: q })}>
                <div className="text-sm text-slate-700 truncate font-medium">{q.text}</div>
                <div className="text-[10px] text-slate-400">{q.type === 'multi' ? '複数選択' : q.type === 'tf' ? '○×' : '単一選択'}・{(q.choices || []).length}択</div>
              </div>
              <div className="flex items-center gap-0.5 shrink-0">
                <button onClick={() => moveQuestion(qi, -1)} disabled={qi === 0} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowUp" size={13} /></button>
                <button onClick={() => moveQuestion(qi, 1)} disabled={qi === questions.length - 1} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"><Icon name="ArrowDown" size={13} /></button>
                <button onClick={() => setQuestionModal({ question: q })} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-100 hover:text-slate-600"><Icon name="Edit2" size={13} /></button>
                <button onClick={() => setDeletingQuestion(q)} className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon name="Trash2" size={13} /></button>
              </div>
            </div>
          ))}
        </div>
        <button onClick={() => setQuestionModal({})}
          className="w-full flex items-center justify-center gap-1.5 py-2.5 rounded-xl border-2 border-dashed border-amber-200 text-amber-500 text-sm font-bold hover:border-amber-400 hover:bg-amber-50/50 transition-colors">
          <Icon name="Plus" size={15} />問題を追加
        </button>
      </div>

      {questionModal && (
        <QuestionModal question={questionModal.question} onClose={() => setQuestionModal(null)} onSave={async (qData) => {
          if (questionModal.question) {
            await saveQuiz({ ...quiz, questions: questions.map((q) => q.id === questionModal.question.id ? { ...q, ...qData } : q) }, '問題を更新しました');
          } else {
            await saveQuiz({ ...quiz, questions: [...questions, { id: genId('q'), ...qData }] }, '問題を追加しました');
          }
          setQuestionModal(null);
        }} />
      )}
      {deletingQuestion && (
        <ConfirmDialog title="問題を削除" message={`「${deletingQuestion.text}」を削除しますか？`}
          onCancel={() => setDeletingQuestion(null)}
          onConfirm={async () => { await saveQuiz({ ...quiz, questions: questions.filter((q) => q.id !== deletingQuestion.id) }, '削除しました'); setDeletingQuestion(null); }} />
      )}
      {removingQuiz && (
        <ConfirmDialog title="テストを削除" message={'このレッスンのテストを削除しますか？\n受講生のテスト結果も削除されます（レッスンの完了状態は残ります）。'}
          onCancel={() => setRemovingQuiz(false)}
          onConfirm={async () => {
            try { await actions.deleteQuizResults(lesson.id); } catch (e) { console.error(e); }
            await saveQuiz(null, 'テストを削除しました');
            setRemovingQuiz(false);
          }} />
      )}
    </div>
  );
}

function QuestionModal({ question, onClose, onSave }) {
  const [text, setText] = useState(question ? question.text : '');
  const [qtype, setQtype] = useState(question ? question.type : 'single');
  const [choices, setChoices] = useState(question ? (question.choices || []).map((c) => ({ ...c })) : [
    { id: genId('o'), text: '', correct: true },
    { id: genId('o'), text: '', correct: false },
  ]);
  const [explanation, setExplanation] = useState(question ? question.explanation || '' : '');
  const [busy, setBusy] = useState(false);

  const switchType = (t) => {
    setQtype(t);
    if (t === 'tf') {
      setChoices([
        { id: genId('o'), text: '○ 正しい', correct: true },
        { id: genId('o'), text: '× 間違い', correct: false },
      ]);
    } else if (qtype === 'tf') {
      setChoices([
        { id: genId('o'), text: '', correct: true },
        { id: genId('o'), text: '', correct: false },
      ]);
    } else if (t === 'single') {
      // 単一選択に変更時、正解を1つに絞る
      let found = false;
      setChoices((prev) => prev.map((c) => {
        if (c.correct && !found) { found = true; return c; }
        return { ...c, correct: false };
      }));
    }
  };

  const toggleCorrect = (id) => {
    setChoices((prev) => prev.map((c) => {
      if (qtype === 'multi') return c.id === id ? { ...c, correct: !c.correct } : c;
      return { ...c, correct: c.id === id };
    }));
  };

  const validChoices = choices.filter((c) => c.text.trim());
  const correctCount = validChoices.filter((c) => c.correct).length;
  const canSave = text.trim() && validChoices.length >= 2 && correctCount >= 1;

  return (
    <Modal title={question ? '問題を編集' : '問題を作成'} onClose={onClose} wide footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || !canSave} onClick={async () => {
          setBusy(true);
          try { await onSave({ text: text.trim(), type: qtype, choices: validChoices, explanation: explanation.trim() }); }
          finally { setBusy(false); }
        }} className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}保存
        </button>
      </>
    }>
      <div className="space-y-4">
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1.5">問題文 <span className="text-red-500">*</span></label>
          <textarea value={text} onChange={(e) => setText(e.target.value)} rows={2} placeholder="例：お客様が不在だった場合、最初にすべきことは？"
            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 resize-y" />
        </div>
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1.5">回答形式</label>
          <div className="flex gap-1.5">
            {[['single', '単一選択'], ['multi', '複数選択'], ['tf', '○×問題']].map(([t, label]) => (
              <button key={t} onClick={() => switchType(t)}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${qtype === t ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                {label}
              </button>
            ))}
          </div>
        </div>
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1.5">
            選択肢（{qtype === 'multi' ? '正解をすべてチェック' : '正解を1つ選択'}）<span className="text-red-500">*</span>
          </label>
          <div className="space-y-2">
            {choices.map((c, ci) => (
              <div key={c.id} className="flex items-center gap-2">
                <button onClick={() => toggleCorrect(c.id)} title="正解にする"
                  className={`shrink-0 w-7 h-7 ${qtype === 'multi' ? 'rounded-lg' : 'rounded-full'} border-2 flex items-center justify-center transition-all ${
                    c.correct ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-300 text-transparent hover:border-emerald-400'
                  }`}>
                  <Icon name="Check" size={13} strokeWidth={3.5} />
                </button>
                <input value={c.text} disabled={qtype === 'tf'}
                  onChange={(e) => setChoices((prev) => prev.map((x) => x.id === c.id ? { ...x, text: e.target.value } : x))}
                  placeholder={`選択肢 ${ci + 1}`}
                  className="flex-1 px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 disabled:bg-slate-50 disabled:text-slate-500" />
                {qtype !== 'tf' && choices.length > 2 && (
                  <button onClick={() => setChoices((prev) => prev.filter((x) => x.id !== c.id))}
                    className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500 shrink-0"><Icon name="X" size={15} /></button>
                )}
              </div>
            ))}
          </div>
          {qtype !== 'tf' && choices.length < 6 && (
            <button onClick={() => setChoices((prev) => [...prev, { id: genId('o'), text: '', correct: false }])}
              className="mt-2 flex items-center gap-1 text-xs font-bold text-indigo-500 hover:text-indigo-700 px-2 py-1 rounded-lg hover:bg-indigo-50">
              <Icon name="Plus" size={13} />選択肢を追加
            </button>
          )}
          {correctCount === 0 && validChoices.length >= 2 && (
            <div className="text-xs text-red-500 mt-2 flex items-center gap-1"><Icon name="AlertTriangle" size={12} />正解を1つ以上設定してください</div>
          )}
        </div>
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1.5">解説（任意）</label>
          <textarea value={explanation} onChange={(e) => setExplanation(e.target.value)} rows={2} placeholder="採点後に表示される解説"
            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 resize-y" />
        </div>
      </div>
    </Modal>
  );
}

function AssignmentEditor({ lesson }) {
  const { actions } = useApp();
  const toast = useToast();
  const assignment = lesson.assignment;
  const [editing, setEditing] = useState(false);
  const [prompt, setPrompt] = useState(assignment ? assignment.prompt : '');
  const [removing, setRemoving] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => { setPrompt(assignment ? assignment.prompt : ''); }, [lesson.id]);

  const save = async () => {
    setBusy(true);
    try {
      await actions.updateLesson(lesson.id, { assignment: { prompt: prompt.trim() } });
      toast('課題を保存しました');
      setEditing(false);
    } catch (e) { console.error(e); toast('保存に失敗しました', 'error'); }
    finally { setBusy(false); }
  };

  if (!assignment && !editing) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 flex items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center shrink-0"><Icon name="ClipboardList" size={20} /></div>
          <div>
            <div className="font-bold text-slate-800 text-sm">課題（テキスト提出）</div>
            <div className="text-xs text-slate-400 mt-0.5">受講生がテキストで回答を提出し、講師がフィードバックできます</div>
          </div>
        </div>
        <button onClick={() => { setPrompt(''); setEditing(true); }}
          className="shrink-0 flex items-center gap-1 px-3.5 py-2 rounded-xl bg-sky-500 text-white text-xs font-bold hover:bg-sky-600 transition-colors">
          <Icon name="Plus" size={14} />追加
        </button>
      </div>
    );
  }

  return (
    <div className="bg-white rounded-2xl border-2 border-sky-200 shadow-sm overflow-hidden">
      <div className="bg-sky-50 px-5 py-3 flex items-center justify-between gap-2 border-b border-sky-100">
        <span className="font-bold text-slate-800 text-sm flex items-center gap-2"><Icon name="ClipboardList" size={17} className="text-sky-500" />課題</span>
        {assignment && !editing && (
          <div className="flex items-center gap-2">
            <button onClick={() => { setPrompt(assignment.prompt); setEditing(true); }} className="text-[11px] font-bold text-sky-600 hover:text-sky-800">編集</button>
            <button onClick={() => setRemoving(true)} className="text-[11px] font-bold text-slate-400 hover:text-red-500">削除</button>
          </div>
        )}
      </div>
      <div className="p-5">
        {editing ? (
          <div>
            <textarea value={prompt} onChange={(e) => setPrompt(e.target.value)} rows={4} autoFocus
              placeholder={'例：今日学んだ内容の中で、明日から実践したいことを3つ書いてください。'}
              className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/40 resize-y" />
            <div className="flex justify-end gap-2 mt-2">
              <button onClick={() => setEditing(false)} className="px-4 py-2 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100">キャンセル</button>
              <button disabled={busy || !prompt.trim()} onClick={save}
                className="px-5 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold disabled:opacity-50 flex items-center gap-1.5">
                {busy && <Spinner size={13} />}保存
              </button>
            </div>
          </div>
        ) : assignment && (
          <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{assignment.prompt}</p>
        )}
      </div>
      {removing && (
        <ConfirmDialog title="課題を削除" message="この課題を削除しますか？受講生の提出内容は残ります。"
          onCancel={() => setRemoving(false)}
          onConfirm={async () => {
            try { await actions.updateLesson(lesson.id, { assignment: null }); toast('課題を削除しました'); setRemoving(false); setEditing(false); }
            catch (e) { console.error(e); toast('削除に失敗しました', 'error'); }
          }} />
      )}
    </div>
  );
}

        </div>
      )}
      {lessonSubs.length === 0 ? (
        <div className="bg-white rounded-2xl border border-slate-100">
          <EmptyState icon="ClipboardList" title="まだ提出がありません" />
        </div>

        const student = users.find((u) => u.id === s.uid);

              <div className="flex gap-2">
                <textarea value={draft} onChange={(e) => setFeedbackDrafts((prev) => ({ ...prev, [s.id]: e.target.value }))} rows={2}
                  placeholder="良かった点・改善点などを伝えましょう"
                  className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40 resize-none" />
                <button disabled={busyId === s.id || !draft.trim()} onClick={async () => {
                  setBusyId(s.id);
                  try {
                    await actions.saveFeedback(s.id, draft.trim());
                    toast('フィードバックを送信しました');
                    setFeedbackDrafts((prev) => { const n = { ...prev }; delete n[s.id]; return n; });
                  } catch (e) { console.error(e); toast('送信に失敗しました', 'error'); }
                  finally { setBusyId(null); }
                }} className="self-end px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold disabled:opacity-50 flex items-center gap-1.5 shrink-0">
                  {busyId === s.id ? <Spinner size={13} /> : <Icon name="Send" size={13} />}送信
                </button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ProgressPage({ initialCourseId }) {
  const { isInstructor } = useApp();
  return isInstructor ? <InstructorProgress initialCourseId={initialCourseId} /> : <StudentProgress />;
}

function InstructorProgress({ initialCourseId }) {
  const { users, courses, lessons, enrollments, quizResults, actions } = useApp();
  const { nav } = useRoute();
  const toast = useToast();
  const [courseId, setCourseId] = useState(initialCourseId || null);
  const [assigning, setAssigning] = useState(false);
  const [removingEn, setRemovingEn] = useState(null);

  const sortedCourses = [...courses].sort((a, b) => (tsToDate(b.createdAt)?.getTime() || 0) - (tsToDate(a.createdAt)?.getTime() || 0));
  const defaultCourse = useMemo(() => {
    if (!sortedCourses.length) return null;
    const countOf = (c) => enrollments.filter((e) => e.courseId === c.id).length;
    return [...sortedCourses].sort((a, b) => countOf(b) - countOf(a))[0];
  }, [courses, enrollments]);
  const course = sortedCourses.find((c) => c.id === courseId) || defaultCourse;

  if (!course) {
    return (
      <div className="space-y-4">
        <h1 className="text-xl font-bold text-slate-900">進捗管理</h1>
        <div className="bg-white rounded-2xl border border-slate-100">
          <EmptyState icon="BarChart" title="コースがまだありません" description="コースを作成すると受講生の進捗を確認できます"
            action={<button onClick={() => nav('courses')} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">コースを作成</button>} />
        </div>
      </div>
    );
  }

  const orderedLessons = sortedLessonsOf(course, lessons);
  const courseEnrollments = enrollments
    .filter((e) => e.courseId === course.id)
    .map((en) => ({ en, student: users.find((u) => u.id === en.uid) }))
    .filter((x) => x.student && x.student.role === 'student')
    .sort((a, b) => (a.student.displayName || '').localeCompare(b.student.displayName || '', 'ja'));

  const avgPercent = courseEnrollments.length
    ? Math.round(courseEnrollments.reduce((sum, { en }) => sum + courseProgressOf(course, lessons, en).percent, 0) / courseEnrollments.length)
    : 0;
  const quizLessons = orderedLessons.filter((l) => l.quiz && (l.quiz.questions || []).length > 0);
  const quizLessonIds = new Set(quizLessons.map((l) => l.id));
  const enrolledUids = new Set(courseEnrollments.map(({ en }) => en.uid));
  const courseQuizResults = quizResults.filter((r) => r.courseId === course.id && quizLessonIds.has(r.lessonId) && enrolledUids.has(r.uid));
  const avgQuizScore = courseQuizResults.length
    ? Math.round(courseQuizResults.reduce((s, r) => s + (r.bestScore || 0), 0) / courseQuizResults.length)
    : null;

  const exportCSV = () => {
    const header = ['受講生', ...orderedLessons.map((l, i) => `${i + 1}. ${l.title}`), '進捗率', 'テスト平均'];
    const rows = courseEnrollments.map(({ en, student }) => {
      const completed = en.completedLessons || {};
      const cells = orderedLessons.map((l) => {
        const hasQuiz = l.quiz && (l.quiz.questions || []).length > 0;
        const qr = quizResults.find((r) => r.uid === en.uid && r.lessonId === l.id);
        if (hasQuiz) return qr ? `${qr.bestScore}点${qr.passed ? '(合格)' : '(不合格)'}` : '未受験';
        return completed[l.id] ? '完了' : '未完了';
      });
      const p = courseProgressOf(course, lessons, en);
      const myQuiz = courseQuizResults.filter((r) => r.uid === en.uid);
      const avg = myQuiz.length ? Math.round(myQuiz.reduce((s, r) => s + (r.bestScore || 0), 0) / myQuiz.length) + '点' : '—';
      return [student.displayName, ...cells, `${p.percent}%`, avg];
    });
    downloadCSV(`進捗_${course.title}_${fmtDate(Date.now()).replace(/\//g, '-')}.csv`, [header, ...rows]);
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <h1 className="text-xl font-bold text-slate-900">進捗管理</h1>
        <div className="flex gap-2">
          <button onClick={() => setAssigning(true)}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition-colors">
            <Icon name="UserPlus" size={14} />受講生を追加
          </button>
          <button onClick={exportCSV} disabled={courseEnrollments.length === 0}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-100 transition-colors disabled:opacity-40">
            <Icon name="Download" size={14} />CSV出力
          </button>
        </div>
      </div>

      {/* コース選択 */}
      <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
        {sortedCourses.map((c) => (
          <button key={c.id} onClick={() => setCourseId(c.id)}
            className={`shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all border ${
              c.id === course.id ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'
            }`}>
            <span>{c.emoji}</span>{c.title}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="Users" label="受講生" value={courseEnrollments.length} tone="sky" />
        <StatCard icon="BarChart" label="平均進捗率" value={`${avgPercent}%`} tone="emerald" />
        <StatCard icon="Award" label="テスト平均" value={avgQuizScore != null ? `${avgQuizScore}点` : '—'} sub={quizLessons.length ? `テスト${quizLessons.length}件` : 'テストなし'} tone="amber" />
      </div>

      {courseEnrollments.length === 0 ? (
        <div className="bg-white rounded-2xl border border-slate-100">
          <EmptyState icon="Users" title="このコースにはまだ受講生がいません"
            description={course.published
              ? '公開中のため受講生はコース一覧から参加できます。コースページの招待コードを共有して案内することもできます。'
              : '非公開コースです。コースページの招待コードを共有して受講生を招待しましょう。'} />
        </div>
      ) : (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div className="overflow-x-auto">
            <table className="text-xs w-full" style={{ minWidth: `${180 + orderedLessons.length * 56 + 120}px` }}>
              <thead>
                <tr className="border-b border-slate-100">
                  <th className="sticky left-0 bg-white text-left px-4 py-3 font-bold text-slate-500 min-w-[150px] z-10">受講生</th>
                  {orderedLessons.map((l, i) => {
                    const hasQuiz = l.quiz && (l.quiz.questions || []).length > 0;
                    return (
                      <th key={l.id} className="px-1 py-3 font-bold text-slate-400 text-center w-14" title={l.title}>
                        <button onClick={() => nav('lesson', { lessonId: l.id })} className="hover:text-indigo-600 flex flex-col items-center gap-0.5 w-full">
                          <span>{i + 1}</span>
                          {hasQuiz && <Icon name="HelpCircle" size={10} className="text-amber-400" />}
                        </button>
                      </th>
                    );
                  })}
                  <th className="px-3 py-3 font-bold text-slate-500 text-right min-w-[70px]">進捗</th>
                  <th className="w-10" />
                </tr>
              </thead>
              <tbody>
                {courseEnrollments.map(({ en, student }) => {
                  const completed = en.completedLessons || {};
                  const p = courseProgressOf(course, lessons, en);
                  return (
                    <tr key={en.id} className="border-b border-slate-50 hover:bg-slate-50/60">
                      <td className="sticky left-0 bg-white px-4 py-2.5 z-10">
                        <div className="flex items-center gap-2 min-w-0">
                          <Avatar name={student.displayName} size="sm" />
                          <div className="min-w-0">
                            <div className="font-bold text-slate-700 truncate">{student.displayName}</div>
                            <div className="text-[10px] text-slate-400">{en.lastActivityAt ? `最終学習 ${fmtRelative(en.lastActivityAt)}` : '未学習'}</div>
                          </div>
                        </div>
                      </td>
                      {orderedLessons.map((l) => {
                        const hasQuiz = l.quiz && (l.quiz.questions || []).length > 0;
                        const qr = quizResults.find((r) => r.uid === en.uid && r.lessonId === l.id);
                        const done = !!completed[l.id];
                        return (
                          <td key={l.id} className="px-1 py-2.5 text-center">
                            {hasQuiz ? (
                              qr ? (
                                <span className={`inline-block px-1.5 py-0.5 rounded-md font-bold ${qr.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'}`}>{qr.bestScore}</span>
                              ) : <span className="text-slate-200">—</span>
                            ) : done ? (
                              <Icon name="CheckCircle" size={15} className="text-emerald-500 inline" />
                            ) : (
                              <span className="text-slate-200">—</span>
                            )}
                          </td>
                        );
                      })}
                      <td className="px-3 py-2.5 text-right">
                        <span className={`font-bold ${p.percent >= 100 ? 'text-emerald-600' : 'text-slate-700'}`}>{p.percent}%</span>
                      </td>
                      <td className="px-2 py-2.5 text-center w-10">
                        <button onClick={() => setRemovingEn({ en, student })} title="受講解除"
                          className="p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500 transition-colors">
                          <Icon name="X" size={14} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-2.5 border-t border-slate-50 flex items-center gap-4 text-[10px] text-slate-400 flex-wrap">
            <span className="flex items-center gap-1"><Icon name="CheckCircle" size={11} className="text-emerald-500" />完了</span>
            <span className="flex items-center gap-1"><span className="px-1 rounded bg-emerald-100 text-emerald-700 font-bold">90</span>テスト合格（ベストスコア）</span>
            <span className="flex items-center gap-1"><span className="px-1 rounded bg-red-100 text-red-600 font-bold">60</span>テスト未合格</span>
            <span className="flex items-center gap-1"><Icon name="HelpCircle" size={11} className="text-amber-400" />テストあり</span>
          </div>
        </div>
      )}

      {assigning && (
        <AssignStudentsModal course={course} onClose={() => setAssigning(false)} onAssign={async (uids) => {
          try {
            await actions.assignStudents(course.id, uids);
            toast(`${uids.length}名を「${course.title}」に追加しました`);
            setAssigning(false);
          } catch (e) { console.error(e); toast('追加に失敗しました', 'error'); }
        }} />
      )}
      {removingEn && (
        <ConfirmDialog title="受講解除"
          message={`${removingEn.student.displayName}さんを「${course.title}」から受講解除しますか？\nレッスンの完了状況・学習日数の記録は削除されます（テスト結果・課題提出・コメントは残ります）。\n${course.published ? '公開中のコースのため、受講生はコース一覧からいつでも再参加できます。' : '招待コードを知っていれば再参加できます。'}`}
          confirmLabel="解除する"
          onCancel={() => setRemovingEn(null)}
          onConfirm={async () => {
            try { await actions.removeEnrollment(removingEn.en.id); toast('受講解除しました'); setRemovingEn(null); }
            catch (e) { console.error(e); toast('解除に失敗しました', 'error'); }
          }} />
      )}
    </div>
  );
}

// 受講生の一括割当モーダル（講師）
function AssignStudentsModal({ course, onClose, onAssign }) {
  const { users, enrollments } = useApp();
  const enrolledIds = new Set(enrollments.filter((e) => e.courseId === course.id).map((e) => e.uid));
  const candidates = users
    .filter((u) => u.role === 'student' && !enrolledIds.has(u.id))
    .sort((a, b) => (a.displayName || '').localeCompare(b.displayName || '', 'ja'));
  const [selected, setSelected] = useState({});
  const [busy, setBusy] = useState(false);
  const ids = Object.keys(selected).filter((k) => selected[k]);
  return (
    <Modal title={`「${course.title}」に受講生を追加`} onClose={onClose} footer={
      <>
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">キャンセル</button>
        <button disabled={busy || ids.length === 0}
          onClick={async () => { setBusy(true); try { await onAssign(ids); } finally { setBusy(false); } }}
          className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 flex items-center gap-2">
          {busy && <Spinner size={14} />}追加する{ids.length > 0 ? `（${ids.length}名）` : ''}
        </button>
      </>
    }>
      {candidates.length === 0 ? (
        <div className="text-sm text-slate-400 text-center py-6">追加できる受講生がいません（全員受講中です）</div>
      ) : (
        <div className="space-y-1">
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs text-slate-400">追加する受講生を選択してください</p>
            <button onClick={() => {
              const all = candidates.every((u) => selected[u.id]);
              const next = {};
              candidates.forEach((u) => { next[u.id] = !all; });
              setSelected(next);
            }} className="text-[11px] font-bold text-indigo-600 hover:text-indigo-800">全員選択/解除</button>
          </div>
          {candidates.map((u) => (
            <label key={u.id} className="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 cursor-pointer select-none">
              <input type="checkbox" checked={!!selected[u.id]}
                onChange={(e) => setSelected((prev) => ({ ...prev, [u.id]: e.target.checked }))}
                className="w-4 h-4 rounded accent-indigo-600" />
              <Avatar name={u.displayName} size="sm" />
              <span className="min-w-0">
                <span className="block text-sm font-bold text-slate-800 truncate">{u.displayName}</span>
                <span className="block text-xs text-slate-400 truncate">{u.email}</span>
              </span>
            </label>
          ))}
        </div>
      )}
    </Modal>
  );
}

function StudentProgress() {
  const { authUser, courses, lessons, enrollments, quizResults } = useApp();
  const { nav } = useRoute();
  const [certCourse, setCertCourse] = useState(null);
  const myEnrollments = enrollments.filter((e) => e.uid === authUser.uid);
  const myCourses = myEnrollments
    .map((en) => ({ en, course: courses.find((c) => c.id === en.courseId) }))
    .filter((x) => x.course);

  if (myCourses.length === 0) {
    return (
      <div className="space-y-4">
        <h1 className="text-xl font-bold text-slate-900">学習状況</h1>
        <div className="bg-white rounded-2xl border border-slate-100">
          <EmptyState icon="BarChart" title="まだ学習データがありません" description="コースを受講すると進捗が表示されます"
            action={<button onClick={() => nav('courses')} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">コースを探す</button>} />
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      <h1 className="text-xl font-bold text-slate-900">学習状況</h1>
      {myCourses.map(({ en, course }) => {
        const orderedLessons = sortedLessonsOf(course, lessons);
        const completed = en.completedLessons || {};
        const p = courseProgressOf(course, lessons, en);
        return (
          <div key={course.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-5 pb-4 cursor-pointer hover:bg-slate-50/60 transition-colors" onClick={() => nav('course', { courseId: course.id })}>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0" style={{ background: `${course.color}18` }}>{course.emoji}</div>
                <div className="min-w-0 flex-1">
                  <div className="font-bold text-sm text-slate-800">{course.title}</div>
                  <div className="text-[11px] text-slate-400">{p.done}/{p.total} レッスン完了{en.lastActivityAt ? `・最終学習 ${fmtRelative(en.lastActivityAt)}` : ''}</div>
                </div>
                {p.percent >= 100 && p.total > 0 && course.certificateEnabled && (
                  <button onClick={(e) => { e.stopPropagation(); setCertCourse(course); }}
                    className="shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 text-[11px] font-bold hover:bg-emerald-100 transition-colors">
                    <Icon name="GraduationCap" size={12} />修了証
                  </button>
                )}
                <span className={`text-lg font-bold shrink-0 ${p.percent >= 100 ? 'text-emerald-600' : 'text-indigo-600'}`}>{p.percent}%</span>
              </div>
              <ProgressBar percent={p.percent} />
            </div>
            <div className="border-t border-slate-50 divide-y divide-slate-50 max-h-72 overflow-y-auto">
              {orderedLessons.map((l) => {
                const done = !!completed[l.id];
                const hasQuiz = l.quiz && (l.quiz.questions || []).length > 0;
                const qr = quizResults.find((r) => r.uid === authUser.uid && r.lessonId === l.id);
                return (
                  <button key={l.id} onClick={() => nav('lesson', { lessonId: l.id })}
                    className="w-full flex items-center gap-2.5 px-5 py-2.5 hover:bg-indigo-50/40 transition-colors text-left">
                    {done ? <Icon name="CheckCircle" size={16} className="text-emerald-500 shrink-0" /> : <Icon name="Circle" size={16} className="text-slate-200 shrink-0" />}
                    <span className={`text-xs flex-1 truncate ${done ? 'text-slate-500' : 'text-slate-700 font-medium'}`}>{l.title}</span>
                    {hasQuiz && (
                      qr
                        ? <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md shrink-0 ${qr.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'}`}>{qr.bestScore}点</span>
                        : <span className="text-[10px] text-amber-500 font-bold shrink-0 flex items-center gap-0.5"><Icon name="HelpCircle" size={10} />テスト</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
      {certCourse && <CertificateModal course={certCourse} onClose={() => setCertCourse(null)} />}
    </div>
  );
}

// ========== 受講生管理（講師） ==========
function StudentsPage() {
  const { authUser, users, courses, lessons, enrollments, quizResults, actions } = useApp();
  const toast = useToast();
  const [query, setQuery] = useState('');
  const [detailUser, setDetailUser] = useState(null);
  const [roleChange, setRoleChange] = useState(null);

  const filtered = users
    .filter((u) => !query.trim() || (u.displayName + ' ' + (u.email || '')).toLowerCase().includes(query.trim().toLowerCase()))
    .sort((a, b) => {
      if (a.role !== b.role) return a.role === 'instructor' ? -1 : 1;
      return (a.displayName || '').localeCompare(b.displayName || '', 'ja');
    });
  const instructorCount = users.filter((u) => u.role === 'instructor').length;

  return (
    <div className="space-y-4">
      <h1 className="text-xl font-bold text-slate-900">受講生管理</h1>
      <div className="relative">
        <Icon name="Search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="名前・メールで検索..."
          className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-50">
        {filtered.length === 0 && <div className="p-6 text-center text-sm text-slate-400">該当するユーザーがいません</div>}
        {filtered.map((u) => {
          const uEnrollments = enrollments.filter((e) => e.uid === u.id);
          const isSelf = u.id === authUser.uid;
          return (
            <div key={u.id} className="flex items-center gap-3 px-4 py-3.5">
              <Avatar name={u.displayName} role={u.role} />
              <div className="min-w-0 flex-1 cursor-pointer" onClick={() => setDetailUser(u)}>
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-sm font-bold text-slate-800">{u.displayName}</span>
                  {u.role === 'instructor' && <Badge tone="indigo">講師</Badge>}
                  {isSelf && <Badge tone="slate">自分</Badge>}
                </div>
                <div className="text-xs text-slate-400 truncate">{u.email}・登録 {fmtDate(u.createdAt)}{u.role === 'student' ? `・${uEnrollments.length}コース受講中` : ''}</div>
              </div>
              <button onClick={() => setDetailUser(u)} className="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100 transition-colors">詳細</button>
              {!isSelf && (
                <button onClick={() => setRoleChange(u)}
                  className="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-600 hover:bg-indigo-50 transition-colors">
                  {u.role === 'instructor' ? '受講生にする' : '講師にする'}
                </button>
              )}
            </div>
          );
        })}
      </div>

      {detailUser && <StudentDetailModal user={detailUser} onClose={() => setDetailUser(null)} />}
      {roleChange && (
        <ConfirmDialog
          title={roleChange.role === 'instructor' ? '受講生に変更' : '講師に変更'}
          tone="indigo"
          confirmLabel="変更する"
          message={roleChange.role === 'instructor'
            ? (instructorCount <= 1
              ? '講師がいなくなるため変更できません。先に他のユーザーを講師にしてください。'
              : `${roleChange.displayName}さんを受講生に変更しますか？コースの管理ができなくなります。`)
            : `${roleChange.displayName}さんを講師に変更しますか？コースの作成・編集・受講生の管理ができるようになります。`}
          onCancel={() => setRoleChange(null)}
          onConfirm={async () => {
            if (roleChange.role === 'instructor' && instructorCount <= 1) { setRoleChange(null); return; }
            try {
              await actions.setUserRole(roleChange.id, roleChange.role === 'instructor' ? 'student' : 'instructor');
              toast('権限を変更しました');
              setRoleChange(null);
            } catch (e) { console.error(e); toast('変更に失敗しました', 'error'); }
          }} />
      )}
    </div>
  );
}

function StudentDetailModal({ user, onClose }) {
  const { courses, lessons, enrollments, quizResults, submissions } = useApp();
  const uEnrollments = enrollments
    .map((en) => ({ en, course: courses.find((c) => c.id === en.courseId) }))
    .filter((x) => x.en.uid === user.id && x.course);
  const uCourseIds = new Set(uEnrollments.map((x) => x.en.courseId));
  const uQuiz = quizResults.filter((r) => r.uid === user.id && uCourseIds.has(r.courseId));
  const uSubs = submissions.filter((s) => s.uid === user.id && uCourseIds.has(s.courseId));

  return (
    <Modal title={`${user.displayName}さんの学習状況`} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex items-center gap-3">
          <Avatar name={user.displayName} size="lg" role={user.role} />
          <div>
            <div className="font-bold text-slate-900">{user.displayName}{user.role === 'instructor' && <Badge tone="indigo">講師</Badge>}</div>
            <div className="text-xs text-slate-400">{user.email}</div>
            <div className="text-[11px] text-slate-400 mt-0.5">登録日 {fmtDate(user.createdAt)}</div>
          </div>
        </div>

        <div className="grid grid-cols-3 gap-2">
          <div className="bg-slate-50 rounded-xl p-3 text-center">
            <div className="text-lg font-bold text-slate-800">{uEnrollments.length}</div>
            <div className="text-[10px] text-slate-400">受講コース</div>
          </div>
          <div className="bg-slate-50 rounded-xl p-3 text-center">
            <div className="text-lg font-bold text-slate-800">{uQuiz.filter((r) => r.passed).length}/{uQuiz.length}</div>
            <div className="text-[10px] text-slate-400">テスト合格</div>
          </div>
          <div className="bg-slate-50 rounded-xl p-3 text-center">
            <div className="text-lg font-bold text-slate-800">{uSubs.length}</div>
            <div className="text-[10px] text-slate-400">課題提出</div>
          </div>
        </div>

        {uEnrollments.length === 0 ? (
          <div className="text-sm text-slate-400 text-center py-4">受講中のコースはありません</div>
        ) : (
          <div className="space-y-3">
            {uEnrollments.map(({ en, course }) => {
              const p = courseProgressOf(course, lessons, en);
              const courseQuiz = uQuiz.filter((r) => r.courseId === course.id);
              return (
                <div key={en.id} className="border border-slate-100 rounded-xl p-4">
                  <div className="flex items-center gap-2.5 mb-2">
                    <span className="text-lg">{course.emoji}</span>
                    <span className="text-sm font-bold text-slate-800 flex-1 min-w-0 truncate">{course.title}</span>
                    <span className={`text-sm font-bold ${p.percent >= 100 ? 'text-emerald-600' : 'text-indigo-600'}`}>{p.percent}%</span>
                  </div>
                  <ProgressBar percent={p.percent} size="sm" />
                  <div className="flex items-center gap-3 mt-2 text-[11px] text-slate-400 flex-wrap">
                    <span>{p.done}/{p.total} レッスン</span>
                    {courseQuiz.length > 0 && <span>テスト: {courseQuiz.map((r) => `${r.bestScore}点`).join(' / ')}</span>}
                    {en.lastActivityAt && <span>最終学習 {fmtRelative(en.lastActivityAt)}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </Modal>
  );
}

          <Icon name="LogOut" size={16} />{IS_DEMO ? 'デモデータをリセット' : 'ログアウト'}
        </button>
        {IS_DEMO && <p className="text-[11px] text-slate-400 mt-2 text-center">デモ版のためログアウトするとサンプルデータが初期状態に戻ります</p>}
      </div>

      <div className="text-center text-[11px] text-slate-300 pt-2">ハコマナ — 研修・教育プラットフォーム</div>
    </div>
  );
}

// ========== ルート ==========
function Root() {
  return (
    <ToastProvider>
      <AppProvider>
        <App />
      </AppProvider>
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);

</script>
</body>
</html>
