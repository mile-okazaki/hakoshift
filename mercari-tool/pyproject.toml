[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercari-tool"
version = "0.1.0"
description = "メルカリ出品支援エンジン（リサーチ・価格設定・画像加工・文章生成・仕入れ分析・売上管理）"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "anthropic>=0.60",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0", "google-auth>=2.30"]
dev = ["pytest>=8.0"]

[project.scripts]
mercari-tool = "mercari_tool.cli:main"

[tool.setuptools.packages.find]
include = ["mercari_tool*"]

[tool.setuptools.package-data]
mercari_tool = ["../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
