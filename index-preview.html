<title>ハコシフ【デモ版】- モバイル表示確認用</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- DEMO MODE: Mock Firebase with localStorage -->
<script>
(function() {
  const DEMO_PREFIX = 'hakoshift-demo';
  const DEMO_USER = { uid: 'demo-admin', email: 'demo@hakoshift.preview', displayName: 'デモ管理者' };

  // ----- storage helpers -----
  function _key(coll, id) { return `${DEMO_PREFIX}:${coll}:${id}`; }
  function _get(coll, id) {
    try { const raw = localStorage.getItem(_key(coll, id)); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function _set(coll, id, data) {
    localStorage.setItem(_key(coll, id), JSON.stringify(data));
    _notify(coll, id, data);
  }
  function _listDocs(coll) {
    const prefix = `${DEMO_PREFIX}:${coll}:`;
    const docs = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) {
        const id = k.substring(prefix.length);
        try {
          const data = JSON.parse(localStorage.getItem(k));
          docs.push({ id, data: () => data, exists: true });
        } catch (e) {}
      }
    }
    return docs;
  }

  // ----- snapshot listener registry -----
  const _docSubs = {};   // 'coll:id' => [cb]
  const _collSubs = {};  // 'coll'    => [cb]
  function _notify(coll, id, data) {
    const dk = `${coll}:${id}`;
    (_docSubs[dk] || []).forEach(cb => { try { cb({ exists: data != null, data: () => data, id }); } catch (e) {} });
    (_collSubs[coll] || []).forEach(cb => {
      try { const docs = _listDocs(coll); cb({ forEach: fn => docs.forEach(fn) }); } catch (e) {}
    });
  }

  // ----- mock auth -----
  const auth = {
    currentUser: DEMO_USER,
    onAuthStateChanged(cb) {
      Promise.resolve().then(() => cb(DEMO_USER));
      return () => {};
    },
    signOut() {
      // Demo mode: reset all demo data on sign out
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(DEMO_PREFIX)) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      location.reload();
      return Promise.resolve();
    },
    signInWithEmailAndPassword: () => Promise.resolve({ user: DEMO_USER }),
    createUserWithEmailAndPassword: () => Promise.resolve({ user: DEMO_USER }),
    signInWithPopup: () => Promise.resolve({ user: DEMO_USER }),
  };

  // ----- mock firestore -----
  const db = {
    collection(name) {
      return {
        doc(id) {
          return {
            get() {
              const data = _get(name, id);
              return Promise.resolve({ exists: data != null, data: () => data, id });
            },
            set(data, opts) {
              if (opts && opts.merge) {
                const existing = _get(name, id) || {};
                _set(name, id, Object.assign({}, existing, data));
              } else {
                _set(name, id, data);
              }
              return Promise.resolve();
            },
            update(data) {
              const existing = _get(name, id) || {};
              _set(name, id, Object.assign({}, existing, data));
              return Promise.resolve();
            },
            delete() {
              localStorage.removeItem(_key(name, id));
              _notify(name, id, null);
              return Promise.resolve();
            },
            onSnapshot(cb, errCb) {
              const dk = `${name}:${id}`;
              (_docSubs[dk] = _docSubs[dk] || []).push(cb);
              Promise.resolve().then(() => {
                const data = _get(name, id);
                try { cb({ exists: data != null, data: () => data, id }); } catch (e) {}
              });
              return () => { _docSubs[dk] = (_docSubs[dk] || []).filter(l => l !== cb); };
            },
          };
        },
        add(data) {
          const id = `auto_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
          _set(name, id, data);
          return Promise.resolve({ id });
        },
        limit(n) {
          return {
            get() {
              const docs = _listDocs(name).slice(0, n);
              return Promise.resolve({
                empty: docs.length === 0,
                forEach: fn => docs.forEach(fn),
                docs,
              });
            },
          };
        },
        onSnapshot(cb, errCb) {
          (_collSubs[name] = _collSubs[name] || []).push(cb);
          Promise.resolve().then(() => {
            try { const docs = _listDocs(name); cb({ forEach: fn => docs.forEach(fn) }); } catch (e) {}
          });
          return () => { _collSubs[name] = (_collSubs[name] || []).filter(l => l !== cb); };
        },
      };
    },
  };

  // ----- mock firebase global -----
  const _authFn = function() { return auth; };
  _authFn.GoogleAuthProvider = function() { return { providerId: 'google.com' }; };
  const _fsFn = function() { return db; };
  _fsFn.FieldValue = { serverTimestamp: () => new Date() };
  _fsFn.Timestamp = {
    fromDate: (d) => ({
      toDate: () => d,
      seconds: Math.floor(d.getTime() / 1000),
      nanoseconds: 0,
      toMillis: () => d.getTime(),
    }),
    now: () => {
      const d = new Date();
      return {
        toDate: () => d,
        seconds: Math.floor(d.getTime() / 1000),
        nanoseconds: 0,
        toMillis: () => d.getTime(),
      };
    },
    fromMillis: (ms) => {
      const d = new Date(ms);
      return {
        toDate: () => d,
        seconds: Math.floor(ms / 1000),
        nanoseconds: 0,
        toMillis: () => ms,
      };
    },
  };
  window.firebase = {
    initializeApp: () => ({ name: '[DEFAULT]' }),
    auth: _authFn,
    firestore: _fsFn,
  };

  // ----- pre-populate sample data on first load -----
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function initDemoData() {
    if (_get('_meta', 'init')) return;

    // demo user as admin
    _set('users', DEMO_USER.uid, {
      uid: DEMO_USER.uid,
      email: DEMO_USER.email,
      displayName: DEMO_USER.displayName,
      role: 'admin',
      editUntil: null,
      createdAt: new Date(),
    });

    const teams = [
      { id: 't1', name: '1班', color: '#3b82f6' },
      { id: 't2', name: '2班', color: '#10b981' },
      { id: 't3', name: '3班', color: '#f59e0b' },
      { id: 't4', name: '4班', color: '#ef4444' },
      { id: 't5', name: '5班', color: '#a855f7' },
    ];

    const shiftTypes = [
      { id: 'st_S', name: 'S', time: '8:00-21:00', color: '#3b82f6' },
      { id: 'st_A', name: 'A', time: '6:00-15:00', color: '#10b981' },
      { id: 'st_P', name: 'P', time: '13:00-22:00', color: '#f59e0b' },
    ];

    const staff = [
      { id: 's1',  name: '井上真', teamId: 't1', vehicle: '6112', area: '浜玉コース',                 role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's2',  name: '瀬戸',   teamId: 't1', vehicle: '6225', area: '唐津東コース',               role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's3',  name: '吉野',   teamId: 't1', vehicle: '6600', area: '波多江,波多江駅北,波多江駅南', role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's4',  name: '池尻',   teamId: 't1', vehicle: '6601', area: '高田,板持,池田',             role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's5',  name: '西川',   teamId: 't1', vehicle: '6616', area: '前原駅南,西,萩の浦',         role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's6',  name: '塘岡',   teamId: 't1', vehicle: '6617', area: '前原中央,北,東',             role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's7',  name: '村上',   teamId: 't1', vehicle: '',     area: '',                           role: 'スペア',     defaultShiftType: '',     fixedDayOff: [0] },
      { id: 's8',  name: '田中',   teamId: 't2', vehicle: '6701', area: '加布里,東,西',               role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's9',  name: '佐藤',   teamId: 't2', vehicle: '6702', area: '志摩中央',                   role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's10', name: '高橋',   teamId: 't2', vehicle: '6703', area: '浜玉コース',                 role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's11', name: '鈴木',   teamId: 't3', vehicle: '6801', area: '糸島東部',                   role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's12', name: '渡辺',   teamId: 't3', vehicle: '6802', area: '深江',                       role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's13', name: '山本',   teamId: 't4', vehicle: '6901', area: '二丈',                       role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's14', name: '木村',   teamId: 't4', vehicle: '6902', area: '可也',                       role: 'ドライバー', defaultShiftType: 'st_P', fixedDayOff: [0] },
      { id: 's15', name: '中村',   teamId: 't5', vehicle: '7001', area: '志摩前原',                   role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
      { id: 's16', name: '小林',   teamId: 't5', vehicle: '7002', area: '志摩松隈',                   role: 'ドライバー', defaultShiftType: 'st_S', fixedDayOff: [0] },
    ];

    _set('data', 'shared', {
      staff, teams, shiftTypes,
      areas: ['浜玉コース','唐津東コース','波多江','高田','前原駅南','前原中央','加布里','志摩中央','志摩東','糸島東部','深江','二丈','可也','志摩前原','志摩松隈'],
      roles: ['ドライバー', 'スペア', 'リーダー'],
      dayOff: {
        's3': [ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 15))],
        's8': [ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 20))],
      },
      aiSettings: { warnConsecutiveDays: 7, weeklyPatterns: {} },
      customHolidays: {},
      announcements: [
        { id: 'a1', title: '🎉 デモ版へようこそ',
          body: 'これは確認用のデモ版です。サンプルデータが入っています。どの操作も実際のデータには影響しません。ログアウトボタンを押すとデータがリセットされます。',
          createdAt: Date.now(), pinned: true, createdBy: DEMO_USER.uid },
      ],
    });

    // Generate shifts for prev/current/next month
    const today = new Date();
    for (let mOffset = -1; mOffset <= 1; mOffset++) {
      const target = new Date(today.getFullYear(), today.getMonth() + mOffset, 1);
      const y = target.getFullYear();
      const m = target.getMonth() + 1;
      const ymStr = `${y}-${pad(m)}`;
      const daysInMonth = new Date(y, m, 0).getDate();
      const entries = {};
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(y, m - 1, day);
        const dow = d.getDay();
        const dateStr = `${y}-${pad(m)}-${pad(day)}`;
        staff.forEach(s => {
          // sunday: fixed off (no entry needed because fixedDayOff handles it)
          if (dow === 0) return;
          // spare: no shift normally
          if (s.role === 'スペア') return;
          // random off (~10%) using deterministic seed
          const seed = parseInt(s.id.slice(1)) * 31 + day * 7 + m * 13;
          if (seed % 23 === 0) {
            entries[`${dateStr}:${s.id}`] = 'off';
            return;
          }
          // assign default shift type
          const st = s.defaultShiftType || 'st_S';
          entries[`${dateStr}:${s.id}`] = [{ shiftTypeId: st, area: s.area || '' }, null];
        });
      }
      _set('shifts', ymStr, { entries });
    }

    _set('_meta', 'init', { ts: Date.now(), version: 1 });
  }

  initDemoData();
})();
</script>
